<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafik pracy instruktorów – Auto-MAX</title>
<style>
  :root { --c:#1565c0; --bg:#f3f5f8; --card:#fff; --txt:#1c2430; --mut:#6b7686; --ok:#2e7d32; --err:#c62828; --line:#e3e8ef; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--c); color:#fff; padding:12px 16px 0; }
  header h1 { margin:0; font-size:1.1rem; }
  .logo { background:#a5daf4; border-radius:10px; padding:5px 6px 4px; display:inline-block; margin-bottom:8px; width:300px; max-width:80%; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .logo img { display:block; width:100%; border-radius:6px; }
  .credit { font-size:min(.66rem, 2.7vw); font-style:italic; font-weight:600; color:#2d2482; text-align:center; letter-spacing:0; margin:0 0 3px; white-space:nowrap; overflow:hidden; }
  .credit .fb { width:13px; height:13px; vertical-align:-2px; margin:0 3px 0 2px; }
  .top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  main { max-width:900px; margin:0 auto; padding:12px; }

  /* zakładki */
  .tabs { display:flex; gap:4px; overflow-x:auto; margin-top:10px; padding-bottom:0; scrollbar-width:thin; }
  .tab { flex:0 0 auto; border:0; border-radius:10px 10px 0 0; padding:10px 14px; font-size:.95rem; font-weight:600; cursor:pointer;
         background:rgba(255,255,255,.18); color:#fff; white-space:nowrap; }
  .tab.on { background:var(--bg); color:var(--c); }
  .tab.add { background:rgba(255,255,255,.08); border:1px dashed rgba(255,255,255,.6); }

  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:10px; padding:10px 14px; font-size:.95rem; font-weight:600; cursor:pointer; background:var(--c); color:#fff; }
  .btn.sec { background:#e3e8ef; color:var(--txt); }
  .btn.red { background:var(--err); }
  .btn.small { padding:6px 10px; font-size:.85rem; }
  .btn.icon { padding:8px 10px; min-width:40px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select { padding:9px 10px; font-size:1rem; border:1px solid #cfd6df; border-radius:8px; background:#fff; font-family:inherit; color:inherit; }
  input:focus { outline:2px solid #90caf9; border-color:var(--c); }
  label.l { display:block; font-size:.78rem; color:var(--mut); margin:8px 0 3px; }

  .instr { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .instr h2 { margin:0; font-size:1.15rem; }
  .datebar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .datebig { font-size:1.35rem; font-weight:700; flex:1; min-width:220px; }
  .datebig small { display:block; font-size:.85rem; color:var(--mut); font-weight:500; text-transform:capitalize; }

  /* grafik */
  .slot { display:grid; grid-template-columns:92px 14px 92px 1fr 1fr 40px; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .slot:last-child { border-bottom:0; }
  .slot input[type=time] { width:100%; padding:8px 6px; }
  .slot input.name, .slot input.note { width:100%; }
  .slot .dash { text-align:center; color:var(--mut); }
  .slot.filled { background:linear-gradient(90deg,#e8f2fd 0,#fff 60%); }
  .slot.clash input[type=time] { border-color:var(--err); background:#fdecea; }
  .slot .del { background:none; border:0; font-size:1.2rem; cursor:pointer; color:var(--mut); }
  .slot .del:hover { color:var(--err); }
  .hdr { display:grid; grid-template-columns:92px 14px 92px 1fr 1fr 40px; gap:6px; font-size:.72rem; color:var(--mut); text-transform:uppercase; font-weight:600; padding-bottom:4px; border-bottom:2px solid var(--line); }
  @media (max-width:640px){
    .slot { grid-template-columns:1fr 14px 1fr 40px; }
    .slot input.name { grid-column:1/-1; grid-row:2; }
    .slot input.note { grid-column:1/-1; grid-row:3; }
    .hdr { display:none; }
  }
  .sum { margin-top:10px; color:var(--mut); font-size:.9rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .warn { color:var(--err); font-weight:600; }
  .empty { color:var(--mut); text-align:center; padding:30px 10px; }
  details summary { cursor:pointer; font-weight:600; }
  .rel { display:inline-block; padding:7px 12px; border-radius:999px; font-weight:700; font-size:.9rem; background:#e3e8ef; color:var(--txt); white-space:nowrap; }
  .rel.now { background:#2e7d32; color:#fff; }
  .gap { margin:6px 0; padding:7px 12px; border-radius:8px; background:#fff4e0; border:1px dashed #f0a830; color:#8a5a00; font-size:.9rem; }
  .gap span { color:#a9865a; margin-left:6px; }
  .slot.offslot { background:repeating-linear-gradient(135deg,#f3f3f3 0 8px,#e9e9e9 8px 16px); }
  .offwarn { margin:4px 0 6px; padding:6px 12px; border-radius:8px; background:#eceff3; color:#4a5563; font-size:.85rem; }
  .offwarn.bad { background:#fdecea; color:var(--err); font-weight:600; }
  .offbox { margin-top:12px; border-radius:10px; border:1px solid #d5dbe3; background:#f7f8fa; padding:12px 14px; }
  .offbox .t { font-size:.75rem; text-transform:uppercase; color:#4a5563; font-weight:700; margin-bottom:6px; }
  .offbox .k { color:var(--mut); font-size:.85rem; }
  .offitem { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed #d5dbe3; }
  .offitem span { color:var(--mut); }
  .offitem .del { margin-left:auto; background:none; border:0; font-size:1.1rem; cursor:pointer; color:var(--mut); }
  .offadd { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
  .offadd input[type=time] { width:105px; padding:7px 6px; }
  .offadd #offNote { flex:1; min-width:150px; padding:7px 10px; }
  .saved { font-size:.8rem; color:var(--ok); opacity:0; transition:opacity .3s; }
  .saved.show { opacity:1; }

  .tab.month { margin-left:auto; background:rgba(255,255,255,.28); }
  .tab.month.on, .tab.month2.on { background:var(--bg); }
  .tab.month2 { background:rgba(255,255,255,.28); }
  .offbanner { margin:0 0 10px; padding:10px 12px; border-radius:10px; background:#fff1f0; border:1px solid #f5c2bd; color:#8e1c12; font-size:.92rem; }
  .offbanner a { color:var(--c); margin-left:6px; font-size:.85rem; }
  .offlist .day { font-weight:700; margin:14px 0 4px; text-transform:none; }
  .offlist .day small { color:var(--mut); font-weight:500; }
  .offlist .offitem a { color:inherit; }
  .offlist .offitem.past { opacity:.55; }
  .offform { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
  .offform .full { grid-column:1/-1; }
  .offform input, .offform select { width:100%; }
  @media (max-width:560px){ .offform { grid-template-columns:1fr; } }
  .daysum { margin-top:14px; border-radius:10px; background:#e8f2fd; border:1px solid #bbdefb; padding:12px 14px; display:flex; flex-wrap:wrap; gap:6px 22px; align-items:baseline; }
  .daysum .t { font-size:.75rem; text-transform:uppercase; color:var(--c); font-weight:700; width:100%; }
  .daysum .v { font-size:1.6rem; font-weight:800; color:var(--c); }
  .daysum .k { color:var(--mut); font-size:.85rem; }
  table.mt { width:100%; border-collapse:collapse; font-size:.95rem; }
  table.mt th, table.mt td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  table.mt th { font-size:.72rem; color:var(--mut); text-transform:uppercase; }
  table.mt td.num, table.mt th.num { text-align:right; }
  table.mt tr.total td { font-weight:800; border-top:2px solid var(--txt); border-bottom:0; }
  table.mt tr.inst { cursor:pointer; }
  table.mt tr.inst:hover { background:#f5f9ff; }
  table.mt tr.det td { background:#fafbfd; font-size:.85rem; color:#3a4452; padding:4px 8px 4px 26px; }
  .pa table.mt td, .pa table.mt th { border:1px solid #888; padding:5px 8px; }
  .pa h2 { font-size:13pt; margin:18px 0 6px; }

  .modal-bg { position:fixed; inset:0; background:rgba(10,20,40,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal { background:#fff; border-radius:14px; padding:18px; width:100%; max-width:380px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .modal h3 { margin:0 0 6px; font-size:1.1rem; }
  .modal p { margin:0 0 10px; color:var(--mut); font-size:.9rem; }
  .modal input { width:100%; margin-bottom:8px; }
  .modal .err { color:var(--err); font-size:.85rem; min-height:1.1em; margin-bottom:6px; }
  .modal .row { justify-content:flex-end; }
  .shake { animation:shake .3s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .lock { font-size:.85rem; color:var(--mut); }

  /* druk */
  #printArea { display:none; }
  @media print {
    body { background:#fff; }
    body > *:not(#printArea) { display:none !important; }
    #printArea { display:block; color:#000; }
    @page { size:A4; margin:0; }
    .pa { padding:14mm 14mm 10mm; }
  }
  .pa { font-size:11pt; }
  .pa .ph { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:12px; }
  .pa .ph .lg { width:260px; }
  .pa .ph .lg img { width:100%; display:block; }
  .pa .ph .r { text-align:right; }
  .pa .ph .r b { font-size:15pt; display:block; }
  .pa h1 { font-size:17pt; margin:0 0 2px; }
  .pa .dt { font-size:12pt; margin:0 0 12px; }
  .pa table { width:100%; border-collapse:collapse; }
  .pa th { background:#e8e8e8; text-align:left; padding:6px 8px; border:1px solid #888; font-size:10pt; }
  .pa td { border:1px solid #888; padding:10px 8px; vertical-align:top; }
  .pa td.t { white-space:nowrap; font-weight:700; width:110px; }
  .pa td.n { width:45%; font-size:12pt; }
  .pa .foot { margin-top:14px; font-size:10pt; display:flex; justify-content:space-between; }
  .pa .sign { margin-top:50px; display:flex; justify-content:flex-end; font-size:9pt; }
  .pa .sign div { width:40%; border-top:1px solid #000; text-align:center; padding-top:3px; }
  .pa.week { page-break-after:always; }
  .pa.bw, .pa.bw * { color:#000 !important; }
  .pa.bw th { background:#fff; border:1px solid #000; }
  .pa.bw td { border:1px solid #000; }
  .pa.bw .ph { border-bottom:2px solid #000; }
  .pa .school { font-size:16pt; font-weight:800; letter-spacing:.5px; }
  .pa .school small.by { display:block; font-size:9pt; font-weight:400; font-style:italic; letter-spacing:0; margin-bottom:2px; }
  .pa .school .pfb { width:10pt; height:10pt; vertical-align:-1.5pt; margin:0 2px; }
  .pa.bw .school .pfb path { fill:#fff; }
  .pa .corr { margin-top:16px; border:1px solid #000; padding:10px 12px; display:flex; justify-content:space-between; gap:20px; font-size:11pt; }
  .pa .corr .ln { display:inline-block; width:70px; border-bottom:1px solid #000; margin:0 3px; }
  .pa .sign { margin-top:40px; }
  .pa tr.blank td, .pa table:not(.mt) tbody tr:not(.pgap) td { height:37px; }
  .pa tr.blank td.t { font-weight:400; color:#000; letter-spacing:1px; }
  .pa .poff { margin-top:8px; font-size:10pt; border:1px dashed #000; padding:5px 8px; }
  .pa tr.pgap td { padding:3px 8px; font-size:9.5pt; font-style:italic; text-align:center; border-style:dashed; }
</style>
</head>

    <div><h1>🚗 Grafik pracy instruktorów</h1><div style="font-size:.8rem;opacity:.85">Instruktorzy · kursanci · godziny jazd</div></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="main"></main>

<div id="printArea"></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'automax_grafik_v1';
const DNI = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const MIES = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];

let db = load();
db.off = db.off || {}; // wolne instruktorów: { 'instId|data': [{id, from, to, note}] }
let cur = { inst: db.instructors[0]?.id || null, date: todayStr(), view:'day', month:null };

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.instructors) return Object.assign({ settings:{ start:'06:00', end:'22:00', len:120 }, days:{} }, d);
  } catch(e) {}
  return { instructors:[], days:{}, settings:{ start:'06:00', end:'22:00', len:120 } };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); flash(); } catch(e) { alert('Nie udało się zapisać danych w przeglądarce.'); }
}
function flash() { const s = $('saved'); if (!s) return; s.classList.add('show'); clearTimeout(flash.t); flash.t = setTimeout(()=>s.classList.remove('show'), 1200); }

function todayStr(d = new Date()) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseD(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate()+n); return todayStr(d); }
function fmtLong(s) { const d = parseD(s); return `${d.getDate()} ${MIES[d.getMonth()]} ${d.getFullYear()}`; }
function dow(s) { return DNI[parseD(s).getDay()]; }
function relDay(s) {
  const diff = Math.round((parseD(s) - parseD(todayStr())) / 86400000);
  const map = { '-2':'Przedwczoraj', '-1':'Wczoraj', '0':'Dziś', '1':'Jutro', '2':'Pojutrze' };
  if (map[diff] !== undefined) return map[diff];
  const d = dow(s); return d.charAt(0).toUpperCase() + d.slice(1);
}
function toMin(t) { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; }
function toTime(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uid() { return Math.random().toString(36).slice(2,10); }

function defaultSlots() {
  const st = db.settings, a = toMin(st.start), b = toMin(st.end), len = Number(st.len) || 120, out = [];
  for (let t = a; t + len <= b; t += len) out.push({ id:uid(), start:toTime(t), end:toTime(t+len), name:'', note:'' });
  return out;
}
function dayKey(inst = cur.inst, date = cur.date) { return inst + '|' + date; }
function getDay(inst = cur.inst, date = cur.date) { return db.days[dayKey(inst, date)] || null; }
let pending = null; // domyślne sloty pokazane na ekranie dla niezapisanego dnia
function ensureDay() {
  const k = dayKey();
  if (!db.days[k]) db.days[k] = (pending && pending.key === k) ? pending.slots : defaultSlots();
  return db.days[k];
}
function slotsFor(inst, date) { return getDay(inst, date) || defaultSlots(); }

/* ---------- zakładki ---------- */
function renderTabs() {
  const t = $('tabs');
  t.innerHTML = db.instructors.map(i => `<button class="tab ${i.id===cur.inst?'on':''}" data-id="${i.id}">${esc(i.name)}</button>`).join('')
    + `<button class="tab add" id="addInst">＋ Instruktor</button>`
    + (db.instructors.length ? `<button class="tab month ${cur.view==='off'?'on':''}" id="offTab">⛔ Wolne</button><button class="tab month2 ${cur.view==='month'?'on':''}" id="monthTab">📊 Miesiąc</button>` : '');
  if (cur.view === 'month' || cur.view === 'off') t.querySelectorAll('.tab[data-id]').forEach(b => b.classList.remove('on'));
  t.querySelectorAll('.tab[data-id]').forEach(b => b.onclick = () => { cur.inst = b.dataset.id; cur.view = 'day'; render(); });
  if ($('offTab')) $('offTab').onclick = () => { cur.view = 'off'; render(); };
  if ($('monthTab')) $('monthTab').onclick = () => { cur.view = 'month'; cur.month = cur.month || cur.date.slice(0,7); render(); };

/* ---------- hasło ---------- */
function sha256(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b = new TextEncoder().encode(str), l = b.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(b); m[l] = 0x80; const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const s0 = r(W[i-15],7) ^ r(W[i-15],18) ^ (W[i-15] >>> 3), s1 = r(W[i-2],17) ^ r(W[i-2],19) ^ (W[i-2] >>> 10); W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0; }
    let [a,bb,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0, t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    H = H.map((x, i) => (x + [a,bb,c,d,e,f,g,h][i]) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
const pwHash = pw => sha256('automax|' + pw);
const MASTER = 'b54a59ce92510afb18560b4c8b49da2e0b7596c2dac199874279666e84ed4828'; // hasło awaryjne
function hasPassword() { return !!db.settings.pwHash; }

/* okienko z polami; zwraca Promise z tablicą wartości albo null */
function modal({ title, text = '', fields = [], ok = 'OK', check }) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<form class="modal"><h3>${title}</h3>${text ? `<p>${text}</p>` : ''}
      ${fields.map((f, i) => `<input type="${f.type || 'password'}" placeholder="${esc(f.label)}" data-i="${i}" autocomplete="off">`).join('')}
      <div class="err"></div>
      <div class="row"><button type="button" class="btn sec small" data-x>Anuluj</button><button class="btn small">${ok}</button></div></form>`;
    document.body.appendChild(bg);
    const form = bg.querySelector('form'), err = bg.querySelector('.err'), inputs = [...bg.querySelectorAll('input')];
    const close = v => { bg.remove(); resolve(v); };
    bg.querySelector('[data-x]').onclick = () => close(null);
    bg.onclick = e => { if (e.target === bg) close(null); };
    form.onsubmit = e => {
      e.preventDefault();
      const vals = inputs.map(i => i.value);
      const msg = check ? check(vals) : '';
      if (msg) { err.textContent = msg; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); inputs[0]?.select(); return; }
      close(vals);
    };
    setTimeout(() => inputs[0]?.focus(), 30);
  });
}
/* pyta o hasło, jeśli jest ustawione; true = można działać */
async function requirePassword(what) {
  if (!hasPassword()) return true;
  const r = await modal({ title:'🔒 Podaj hasło', text:what, fields:[{ label:'Hasło' }], ok:'Potwierdź',
    check: v => { const h = pwHash(v[0]); return (h === db.settings.pwHash || h === MASTER) ? '' : 'Złe hasło – spróbuj jeszcze raz.'; } });
  return !!r;
}
async function setPassword() {
  if (hasPassword() && !(await requirePassword('Podaj obecne hasło (albo hasło awaryjne), żeby je zmienić.'))) return;
  const r = await modal({ title: hasPassword() ? '🔑 Zmień hasło' : '🔑 Ustaw hasło',
    text:'Hasło będzie potrzebne przy usuwaniu instruktora, zmianie jego nazwy, kasowaniu jazd i wczytywaniu kopii.',
    fields:[{ label:'Nowe hasło' }, { label:'Powtórz nowe hasło' }], ok:'Zapisz',
    check: v => v[0].length < 4 ? 'Hasło musi mieć co najmniej 4 znaki.' : (v[0] !== v[1] ? 'Hasła nie są takie same.' : '') });
  if (!r) return;
  db.settings.pwHash = pwHash(r[0]); save(); render(); alert('Hasło zostało zapisane.');
}
async function removePassword() {
  if (!(await requirePassword('Podaj obecne hasło (albo hasło awaryjne), żeby wyłączyć ochronę.'))) return;
  delete db.settings.pwHash; save(); render(); alert('Hasło zostało usunięte.');
}

function offFor(inst = cur.inst, date = cur.date) { return (db.off[inst + '|' + date] || []).slice().sort((a,b) => toMin(a.from) - toMin(b.from)); }
function offHit(slot, offs) { const a = toMin(slot.start), b = toMin(slot.end); return offs.filter(o => a < toMin(o.to) && toMin(o.from) < b); }
function offText(offs) { return offs.map(o => `${o.from}–${o.to}${o.note ? ' (' + esc(o.note) + ')' : ''}`).join(', '); }

function slotMin(s) { const a = toMin(s.start), b = toMin(s.end); return (a == null || b == null) ? 0 : Math.max(0, b - a); }
function fmtH(min) { return (min/60).toLocaleString('pl-PL', { maximumFractionDigits:2 }); }
const MIES_M = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
function fmtMonth(ym) { const [y,m] = ym.split('-').map(Number); return MIES_M[m-1] + ' ' + y; }
function addMonth(ym, n) { let [y,m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + String(m).padStart(2,'0'); }

/* zestawienie: { instId: { rides, min, days:[{date, rides, min, first, last}] } } */
function monthStats(ym) {
  const out = {};
  db.instructors.forEach(i => out[i.id] = { rides:0, min:0, days:[] });
  Object.keys(db.days).sort().forEach(k => {
    const [id, date] = k.split('|');
    if (!out[id] || !date.startsWith(ym)) return;
    const f = db.days[k].filter(s => s.name.trim()).sort((a,b) => toMin(a.start) - toMin(b.start));
    if (!f.length) return;
    const min = f.reduce((a,s) => a + slotMin(s), 0);
    out[id].rides += f.length; out[id].min += min;
    out[id].days.push({ date, rides:f.length, min, first:f[0].start, last:f[f.length-1].end });
  });
  return out;
}

function renderMonth() {
  const ym = cur.month || cur.date.slice(0,7);

  let tr = 0, tm = 0;

    return `<tr class="inst" data-id="${i.id}"><td>▸ <b>${esc(i.name)}</b></td><td class="num">${x.days.length}</td><td class="num">${x.rides}</td><td class="num"><b>${fmtH(x.min)}</b></td></tr>
      ${x.days.map(d => `<tr class="det" data-for="${i.id}" hidden><td><a href="#" data-go="${i.id}|${d.date}">${fmtLong(d.date)}</a>, ${dow(d.date)} · ${d.first}–${d.last}</td><td></td><td class="num">${d.rides}</td><td class="num">${fmtH(d.min)}</td></tr>`).join('')}`;
  }).join('');

      if (hi < 0) throw new Error('Nie znalazłem nagłówka „Instruktor” w arkuszu „' + sh.name + '”.');
      const H = sh.rows[hi].map(normName), col = (...n) => H.findIndex(h => n.includes(h));
      const cI = col('instruktor'), cD = col('data'), cS = col('początek','poczatek','od'), cE = col('koniec','do'), cK = col('kursant','imię i nazwisko','imie i nazwisko'), cU = col('uwagi');
      if (cD < 0 || cS < 0 || cE < 0) throw new Error('Brakuje kolumn: Data, Początek, Koniec.');
      const days = {}; let n = 0, skipped = 0;
      // instruktorzy z arkusza „Instruktorzy”
      const si = sheets.find(s => normName(s.name) === 'instruktorzy');
      const extraNames = si ? si.rows.slice(1).map(r => String(r[0] ?? '').trim()).filter(Boolean) : [];
      const getInst = nm => {
        let i = db.instructors.find(x => normName(x.name) === normName(nm));
        if (!i) { i = { id:uid(), name:String(nm).trim() }; db.instructors.push(i); }
        return i;
      };
      const parsed = [];
      sh.rows.slice(hi+1).forEach(r => {
        const nm = String(r[cI] ?? '').trim(), d = cellDate(r[cD], sh.date1904), s = cellTime(r[cS]), e = cellTime(r[cE]);
        if (!nm && !d) return;
        if (!nm || !d || !s || !e) { skipped++; return; }
        parsed.push({ nm, d, s, e, k:cK >= 0 ? String(r[cK] ?? '').trim() : '', u:cU >= 0 ? String(r[cU] ?? '').trim() : '' });
      });
      if (!parsed.length && !extraNames.length) throw new Error('Nie znalazłem żadnych terminów do wczytania.');
      const dayCount = new Set(parsed.map(p => normName(p.nm) + '|' + p.d)).size;
      if (!confirm(`Wczytać z Excela ${parsed.length} terminów (${dayCount} dni)?${skipped ? `\nPominięto ${skipped} wierszy z błędną datą lub godziną.` : ''}\nDni z pliku zastąpią te same dni w programie.`)) return;
      if (!(await requirePassword('Wczytanie kopii z Excela zastąpi dni zapisane w programie.'))) return;
      extraNames.forEach(getInst);
      parsed.forEach(p => { const i = getInst(p.nm), k = i.id + '|' + p.d; (days[k] = days[k] || []).push({ id:uid(), start:p.s, end:p.e, name:p.k, note:p.u }); n++; });
      Object.assign(db.days, days);
      const so = sheets.find(x => normName(x.name) === 'wolne');
      if (so && so.rows.length > 1) {
        const offs = {};
        so.rows.slice(1).forEach(r => { const nm = String(r[0] ?? '').trim(), d = cellDate(r[1], so.date1904), f = cellTime(r[3]), t = cellTime(r[4]);
          if (!nm || !d || !f || !t) return; const k = getInst(nm).id + '|' + d; (offs[k] = offs[k] || []).push({ id:uid(), from:f, to:t, note:String(r[5] ?? '').trim() }); });
        Object.assign(db.off, offs);
      }
      if (!cur.inst) cur.inst = db.instructors[0]?.id || null;
      save(); render();
      alert(`Wczytano ${n} terminów.`);
    } catch (err) { alert('Nie udało się wczytać pliku: ' + (err.message || err)); }
  };
  inp.click();
}

function fmtDur(min) { const h = Math.floor(min/60), m = min % 60; return (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : ''); }
/* przerwy między kolejnymi terminami (sloty posortowane): [{after:index, from, to, min}] */
function findGaps(slots) {
  const out = []; let maxEnd = null;
  slots.forEach((s, i) => {
    const st = toMin(s.start), en = toMin(s.end);
    if (st == null || en == null) return;
    if (maxEnd != null && st > maxEnd) out.push({ after:i-1, from:toTime(maxEnd), to:s.start, min:st - maxEnd });
    maxEnd = maxEnd == null ? en : Math.max(maxEnd, en);
  });
  return out;
}
function findClashes(slots) {
  const bad = new Set();
  for (let i = 0; i < slots.length; i++) {
    const a = slots[i], as = toMin(a.start), ae = toMin(a.end);
    if (as == null || ae == null) continue;
    if (ae <= as) bad.add(a.id);
    for (let j = i+1; j < slots.length; j++) {
      const b = slots[j], bs = toMin(b.start), be = toMin(b.end);
      if (bs == null || be == null) continue;
      if (as < be && bs < ae) { bad.add(a.id); bad.add(b.id); }
    }
  }
  return bad;
}
function allNames() {
  const s = new Set();
  Object.values(db.days).forEach(d => d.forEach(x => { if (x.name.trim()) s.add(x.name.trim()); }));
  return [...s].sort((a,b) => a.localeCompare(b,'pl'));
}

/* ---------- druk ---------- */
function printPages(pages) {
  if (!pages.length) { alert('Brak jazd do wydruku.'); return; }
  $('printArea').innerHTML = pages.map((p, idx) => {
    const slots = slotsFor(p.inst.id, p.date).slice().sort((a,b) => (toMin(a.start)??0) - (toMin(b.start)??0));
    const filled = slots.filter(s => s.name.trim());
    const min = filled.reduce((a,s) => a + Math.max(0, (toMin(s.end)??0) - (toMin(s.start)??0)), 0);
    // na wydruku przerwy liczymy tylko między zaplanowanymi jazdami
    const gaps = findGaps(filled), gapMin = gaps.reduce((a,g) => a + g.min, 0);
    return `<div class="pa bw ${idx < pages.length-1 ? 'week' : ''}">
      <div class="ph"><div class="school"><small class="by">Program przygotował <svg class="pfb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#000"/><path d="M13.4 19.5v-6.1h2.05l.31-2.4H13.4V9.5c0-.69.19-1.16 1.18-1.16h1.26V6.2a17 17 0 0 0-1.84-.1c-1.82 0-3.07 1.11-3.07 3.15V11H8.87v2.4h2.06v6.1z" fill="#fff"/></svg><b>Benek Benek</b> dla</small>AUTO-MAX Szkoła Nauki Jazdy</div>
        <div class="r"><b>${fmtLong(p.date)}</b><span style="text-transform:capitalize">${dow(p.date)}</span></div></div>
      <h1>Grafik pracy instruktora – ${esc(p.inst.name)}</h1>
      <p class="dt">Dzień: ${dow(p.date)}, ${fmtLong(p.date)}</p>
      <table>
        <thead><tr><th>Godzina</th><th>Kursant</th><th>Uwagi</th></tr></thead>
        <tbody>${filled.map((s, i) => `<tr><td class="t">${s.name.trim() ? `${esc(s.start)} – ${esc(s.end)}` : ''}</td><td class="n">${esc(s.name)}${offHit(s, offFor(p.inst.id, p.date)).length ? ' <i style="font-size:8.5pt">(w czasie wolnego!)</i>' : ''}</td><td>${esc(s.note)}</td></tr>`
          + gaps.filter(g => g.after === i).map(g => `<tr class="pgap"><td colspan="3">Przerwa ${fmtDur(g.min)} (${g.from} – ${g.to})</td></tr>`).join('')).join('')}
          ${'<tr class="blank"><td class="t"></td><td></td><td></td></tr>'.repeat(5)}</tbody>
      </table>
      ${offFor(p.inst.id, p.date).length ? `<div class="poff"><b>Wolne instruktora – nie planować:</b> ${offText(offFor(p.inst.id, p.date))}</div>` : ''}
      <div class="foot"><span><b>Podsumowanie dnia:</b> jazd: <b>${filled.length}</b> · godzin: <b>${fmtH(min)}</b>${filled.length ? ` (od ${filled[0].start} do ${filled[filled.length-1].end})` : ''}${gaps.length ? ` · przerwy: <b>${fmtDur(gapMin)}</b>` : ''}</span><span>Wydrukowano: ${new Date().toLocaleString('pl-PL')}</span></div>
      <div class="corr">
        <div>Godziny dopisane ręcznie: <span class="ln"></span> h</div>
        <div><b>Razem godzin w dniu (po korekcie):</b> <span class="ln"></span> h</div>
      </div>
      <div class="sign"><div>podpis instruktora</div></div>
    </div>`;
  }).join('');
  setTimeout(() => window.print(), 50);
}

/* ---------- kopia zapasowa ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 1)], { type:'application/json' });
  download(blob, `grafik-automax-${todayStr()}.json`);
}
function importData() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.instructors || !d.days) throw 0;
        if (!confirm('Wczytać kopię? Obecne dane w tej przeglądarce zostaną zastąpione.')) return;
        if (!(await requirePassword('Wczytanie kopii zastąpi wszystkie dane w programie.'))) return;
        const keepPw = db.settings.pwHash;
        db = Object.assign({ settings:{ start:'06:00', end:'22:00', len:120 } }, d);
        if (keepPw) db.settings.pwHash = keepPw; // obecne hasło zostaje
        db.off = db.off || {};
        cur.inst = db.instructors[0]?.id || null; save(); render();
      } catch(e) { alert('To nie jest poprawny plik kopii grafiku.'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

render();
</script>
