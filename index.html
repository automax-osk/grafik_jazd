<meta name="theme-color" content="#1565c0">
<style>
  :root { --c:#1565c0; --bg:#f3f5f8; --card:#fff; --txt:#1c2430; --mut:#6b7686; --ok:#2e7d32; --err:#c62828; --line:#e3e8ef; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--c); color:#fff; padding:12px 16px 0; }
  header h1 { margin:0; font-size:1.1rem; }
  .logo { background:#a5daf4; border-radius:10px; padding:5px 6px 4px; display:inline-block; margin-bottom:8px; width:300px; max-width:80%; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .logo img { display:block; width:100%; border-radius:6px; }
  .credit { font-size:min(.66rem, 2.7vw); font-style:italic; font-weight:600; color:#2d2482; text-align:center; letter-spacing:0; margin:0 0 3px; white-space:nowrap; overflow:hidden; }
  .credit .fb { width:13px; height:13px; vertical-align:-2px; margin:0 3px 0 2px; }
  .top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  main { max-width:900px; margin:0 auto; padding:12px; }

  /* zakładki */
  .tabs { display:flex; gap:4px; overflow-x:auto; margin-top:10px; padding-bottom:0; scrollbar-width:thin; }
  .tab { flex:0 0 auto; border:0; border-radius:10px 10px 0 0; padding:10px 14px; font-size:.95rem; font-weight:600; cursor:pointer;
         background:rgba(255,255,255,.18); color:#fff; white-space:nowrap; }
  .tab.on { background:var(--bg); color:var(--c); }
  .tab.add { background:rgba(255,255,255,.08); border:1px dashed rgba(255,255,255,.6); }

  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:10px; padding:10px 14px; font-size:.95rem; font-weight:600; cursor:pointer; background:var(--c); color:#fff; }
  .btn.sec { background:#e3e8ef; color:var(--txt); }
  .btn.red { background:var(--err); }
  .btn.small { padding:6px 10px; font-size:.85rem; }
  .btn.icon { padding:8px 10px; min-width:40px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select { padding:9px 10px; font-size:1rem; border:1px solid #cfd6df; border-radius:8px; background:#fff; font-family:inherit; color:inherit; }
  input:focus { outline:2px solid #90caf9; border-color:var(--c); }
  label.l { display:block; font-size:.78rem; color:var(--mut); margin:8px 0 3px; }

  .instr { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .instr h2 { margin:0; font-size:1.15rem; }
  .datebar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .datebig { font-size:1.35rem; font-weight:700; flex:1; min-width:220px; }
  .datebig small { display:block; font-size:.85rem; color:var(--mut); font-weight:500; text-transform:capitalize; }

  /* grafik */
  .slot { display:grid; grid-template-columns:92px 14px 92px 1fr 1fr 40px; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .slot:last-child { border-bottom:0; }
  .slot input[type=time] { width:100%; padding:8px 6px; }
  .slot input.name, .slot input.note { width:100%; }
  .slot .dash { text-align:center; color:var(--mut); }
  .slot.filled { background:linear-gradient(90deg,#e8f2fd 0,#fff 60%); }
  .slot.clash input[type=time] { border-color:var(--err); background:#fdecea; }
  .slot .del { background:none; border:0; font-size:1.2rem; cursor:pointer; color:var(--mut); }
  .slot .del:hover { color:var(--err); }
  .hdr { display:grid; grid-template-columns:92px 14px 92px 1fr 1fr 40px; gap:6px; font-size:.72rem; color:var(--mut); text-transform:uppercase; font-weight:600; padding-bottom:4px; border-bottom:2px solid var(--line); }
  @media (max-width:640px){
    .slot { grid-template-columns:1fr 14px 1fr 40px; }
    .slot input.name { grid-column:1/-1; grid-row:2; }
    .slot input.note { grid-column:1/-1; grid-row:3; }
    .hdr { display:none; }
  }
  .sum { margin-top:10px; color:var(--mut); font-size:.9rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .warn { color:var(--err); font-weight:600; }
  .empty { color:var(--mut); text-align:center; padding:30px 10px; }
  details summary { cursor:pointer; font-weight:600; }
  .rel { display:inline-block; padding:7px 12px; border-radius:999px; font-weight:700; font-size:.9rem; background:#e3e8ef; color:var(--txt); white-space:nowrap; }
  .rel.now { background:#2e7d32; color:#fff; }
  .gap { margin:6px 0; padding:7px 12px; border-radius:8px; background:#fff4e0; border:1px dashed #f0a830; color:#8a5a00; font-size:.9rem; }
  .gap span { color:#a9865a; margin-left:6px; }
  .slot.offslot { background:repeating-linear-gradient(135deg,#f3f3f3 0 8px,#e9e9e9 8px 16px); }
  .offwarn { margin:4px 0 6px; padding:6px 12px; border-radius:8px; background:#eceff3; color:#4a5563; font-size:.85rem; }
  .offwarn.bad { background:#fdecea; color:var(--err); font-weight:600; }
  .offbox { margin-top:12px; border-radius:10px; border:1px solid #d5dbe3; background:#f7f8fa; padding:12px 14px; }
  .offbox .t { font-size:.75rem; text-transform:uppercase; color:#4a5563; font-weight:700; margin-bottom:6px; }
  .offbox .k { color:var(--mut); font-size:.85rem; }
  .offitem { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed #d5dbe3; }
  .offitem span { color:var(--mut); }
  .offitem .del { margin-left:auto; background:none; border:0; font-size:1.1rem; cursor:pointer; color:var(--mut); }
  .offadd { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
  .offadd input[type=time] { width:105px; padding:7px 6px; }
  .offadd #offNote { flex:1; min-width:150px; padding:7px 10px; }
  .slot.virtual input.name::placeholder { color:#b3bcc8; }
  .slot.virtual { opacity:.9; }
  .slot.newride { background:#f2f8ff; border:1px dashed #90caf9; border-radius:10px; padding:8px 6px; margin-top:8px; }
  .slot .addok { border:0; border-radius:8px; background:var(--ok); color:#fff; font-size:1.1rem; font-weight:700; cursor:pointer; height:38px; }
  .wabox { margin-top:12px; border-radius:10px; border:1px solid #b9e4c9; background:#effaf3; padding:12px 14px; }
  .wabox .t { font-size:.75rem; text-transform:uppercase; color:#1f7a45; font-weight:700; margin-bottom:8px; }
  .btn.wa { background:#1fa855; }
  .wabox .log { margin-top:8px; font-size:.85rem; color:#2f4a3a; }
  .wabox .log .no { color:var(--mut); }
  .wabox .log .chg { color:#b45309; font-weight:600; }
  .st-ok { color:#1f7a45; } .st-no { color:var(--mut); } .st-chg { color:#b45309; font-weight:600; }
  table.mt tr.qnext td { background:#e9f9ef; }
  .cloudstat { margin-top:6px; font-size:.78rem; background:rgba(255,255,255,.16); border-radius:999px; padding:3px 10px; display:inline-block; cursor:pointer; }
  .cloudstat:empty { display:none; }
  .cloudstat.warn { background:#ffcc80; color:#5d3a00; }
  .cloudbox { margin-top:10px; padding:10px 12px; border-radius:10px; background:#eef5ff; border:1px solid #cfe0f7; }
  .cloudbox .kv { font-size:.85rem; color:#34475f; line-height:1.6; }
  .cloudbox .err { color:var(--err); font-size:.85rem; }
  .modal.help { max-width:620px; max-height:88vh; overflow:auto; }
  .modal.help ol { padding-left:20px; margin:8px 0 12px; line-height:1.55; font-size:.92rem; }
  .modal.help li { margin-bottom:8px; }
  .modal.help a { color:var(--c); }
  .copyrow { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .copyrow code { background:#f1f4f8; padding:6px 10px; border-radius:6px; font-size:.9rem; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1c2430; color:#fff; padding:12px 16px; border-radius:10px; font-size:.92rem; z-index:60; max-width:92%; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .saved { font-size:.8rem; color:var(--ok); opacity:0; transition:opacity .3s; }
  .saved.show { opacity:1; }

  .tab.month { margin-left:auto; background:rgba(255,255,255,.28); }
  .tab.month.on, .tab.month2.on { background:var(--bg); }
  .tab.month2 { background:rgba(255,255,255,.28); }
  .offbanner { margin:0 0 10px; padding:10px 12px; border-radius:10px; background:#fff1f0; border:1px solid #f5c2bd; color:#8e1c12; font-size:.92rem; }
  .offbanner a { color:var(--c); margin-left:6px; font-size:.85rem; }
  .offlist .day { font-weight:700; margin:14px 0 4px; text-transform:none; }
  .offlist .day small { color:var(--mut); font-weight:500; }
  .offlist .offitem a { color:inherit; }
  .offlist .offitem.past { opacity:.55; }
  .offform { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
  .offform .full { grid-column:1/-1; }
  .offform input, .offform select { width:100%; }
  .offform .allday { display:flex; align-items:center; gap:8px; font-size:.95rem; margin:2px 0 8px; cursor:pointer; }
  .offform .allday input { width:auto; transform:scale(1.2); }
  .orange { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .orange input { width:130px !important; }
  .orange .del { background:none; border:0; font-size:1.1rem; cursor:pointer; color:var(--mut); }
  @media (max-width:560px){ .offform { grid-template-columns:1fr; } }
  .daysum { margin-top:14px; border-radius:10px; background:#e8f2fd; border:1px solid #bbdefb; padding:12px 14px; display:flex; flex-wrap:wrap; gap:6px 22px; align-items:baseline; }
  .daysum .t { font-size:.75rem; text-transform:uppercase; color:var(--c); font-weight:700; width:100%; }
  .daysum .v { font-size:1.6rem; font-weight:800; color:var(--c); }
  .daysum .k { color:var(--mut); font-size:.85rem; }
  table.mt { width:100%; border-collapse:collapse; font-size:.95rem; }
  table.mt th, table.mt td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  table.mt th { font-size:.72rem; color:var(--mut); text-transform:uppercase; }
  table.mt td.num, table.mt th.num { text-align:right; }
  table.mt tr.total td { font-weight:800; border-top:2px solid var(--txt); border-bottom:0; }
  table.mt tr.inst { cursor:pointer; }
  table.mt tr.inst:hover { background:#f5f9ff; }
  table.mt tr.det td { background:#fafbfd; font-size:.85rem; color:#3a4452; padding:4px 8px 4px 26px; }
  .pa table.mt td, .pa table.mt th { border:1px solid #888; padding:5px 8px; }
  .pa h2 { font-size:13pt; margin:18px 0 6px; }

  .modal-bg { position:fixed; inset:0; background:rgba(10,20,40,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal { background:#fff; border-radius:14px; padding:18px; width:100%; max-width:380px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .modal h3 { margin:0 0 6px; font-size:1.1rem; }
  .modal p { margin:0 0 10px; color:var(--mut); font-size:.9rem; }
  .modal input { width:100%; margin-bottom:8px; }
  .modal .err { color:var(--err); font-size:.85rem; min-height:1.1em; margin-bottom:6px; }
  .modal .row { justify-content:flex-end; }
  .shake { animation:shake .3s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .lock { font-size:.85rem; color:var(--mut); }

  /* druk */
  #printArea { display:none; }
  @media print {
    body { background:#fff; }
    body > *:not(#printArea) { display:none !important; }
    #printArea { display:block; color:#000; }
    @page { size:A4; margin:0; }
    .pa { padding:14mm 14mm 10mm; }
  }
  .pa { font-size:11pt; }
  .pa .ph { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:12px; }
  .pa .ph .lg { width:260px; }
  .pa .ph .lg img { width:100%; display:block; }
  .pa .ph .r { text-align:right; }
  .pa .ph .r b { font-size:15pt; display:block; }
  .pa h1 { font-size:17pt; margin:0 0 2px; }
  .pa .dt { font-size:12pt; margin:0 0 12px; }
  .pa table { width:100%; border-collapse:collapse; }
  .pa th { background:#e8e8e8; text-align:left; padding:6px 8px; border:1px solid #888; font-size:10pt; }
  .pa td { border:1px solid #888; padding:10px 8px; vertical-align:top; }
  .pa td.t { white-space:nowrap; font-weight:700; width:110px; }
  .pa td.n { width:45%; font-size:12pt; }
  .pa .foot { margin-top:14px; font-size:10pt; display:flex; justify-content:space-between; }
  .pa .sign { margin-top:50px; display:flex; justify-content:flex-end; font-size:9pt; }
  .pa .sign div { width:40%; border-top:1px solid #000; text-align:center; padding-top:3px; }
  .pa.week { page-break-after:always; }
  .pa.bw, .pa.bw * { color:#000 !important; }
  .pa.bw th { background:#fff; border:1px solid #000; }
  .pa.bw td { border:1px solid #000; }
  .pa.bw .ph { border-bottom:2px solid #000; }
  .pa .school { font-size:16pt; font-weight:800; letter-spacing:.5px; }
  .pa .school small.by { display:block; font-size:9pt; font-weight:400; font-style:italic; letter-spacing:0; margin-bottom:2px; }
  .pa .school .pfb { width:10pt; height:10pt; vertical-align:-1.5pt; margin:0 2px; }
  .pa.bw .school .pfb path { fill:#fff; }
  .pa .corr { margin-top:16px; border:1px solid #000; padding:10px 12px; display:flex; justify-content:space-between; gap:20px; font-size:11pt; }
  .pa .corr .ln { display:inline-block; width:70px; border-bottom:1px solid #000; margin:0 3px; }
  .pa .sign { margin-top:40px; }
  .pa tr.blank td, .pa table:not(.mt) tbody tr:not(.pgap) td { height:37px; }
  .pa tr.blank td.t { font-weight:400; color:#000; letter-spacing:1px; }
  .pa u.ov { text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; }
  .pa .pov { margin-top:6px; font-size:9.5pt; }
  .pa .poff { margin-top:8px; font-size:10pt; border:1px dashed #000; padding:5px 8px; }
  .pa tr.pgap td { padding:3px 8px; font-size:9.5pt; font-style:italic; text-align:center; border-style:dashed; }
</style>
</head>

    <div><h1>🚗 Grafik pracy instruktorów</h1><div style="font-size:.8rem;opacity:.85">Instruktorzy · kursanci · godziny jazd</div>

<main id="main"></main>

<div id="printArea"></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'automax_grafik_v1';
const DNI = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const MIES = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];

let db = load();
cleanDays();
db.sent = db.sent || {}; // historia wysyłek: { 'instId|data': [{at, type, sig}] }
db.off = db.off || {}; // wolne instruktorów: { 'instId|data': [{id, from, to, note}] }
let cur = { inst: db.instructors[0]?.id || null, date: todayStr(), view:'day', month:null };

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.instructors) return Object.assign({ settings:{ start:'06:00', end:'22:00', len:120 }, days:{} }, d);
  } catch(e) {}
  return { instructors:[], days:{}, settings:{ start:'06:00', end:'22:00', len:120 } };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); flash(); } catch(e) { alert('Nie udało się zapisać danych w przeglądarce.'); }
  if (typeof scheduleCloud === 'function') scheduleCloud();
}
function flash() { const s = $('saved'); if (!s) return; s.classList.add('show'); clearTimeout(flash.t); flash.t = setTimeout(()=>s.classList.remove('show'), 1200); }

function todayStr(d = new Date()) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseD(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate()+n); return todayStr(d); }
function fmtLong(s) { const d = parseD(s); return `${d.getDate()} ${MIES[d.getMonth()]} ${d.getFullYear()}`; }
function dow(s) { return DNI[parseD(s).getDay()]; }
function relDay(s) {
  const diff = Math.round((parseD(s) - parseD(todayStr())) / 86400000);
  const map = { '-2':'Przedwczoraj', '-1':'Wczoraj', '0':'Dziś', '1':'Jutro', '2':'Pojutrze' };
  if (map[diff] !== undefined) return map[diff];
  const d = dow(s); return d.charAt(0).toUpperCase() + d.slice(1);
}
function toMin(t) { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; }
function toTime(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uid() { return Math.random().toString(36).slice(2,10); }

function defaultSlots() {
  const st = db.settings, a = toMin(st.start), b = toMin(st.end), len = Number(st.len) || 120, out = [];
  for (let t = a; t + len <= b; t += len) out.push({ id:uid(), start:toTime(t), end:toTime(t+len), name:'', note:'' });
  return out;
}
function dayKey(inst = cur.inst, date = cur.date) { return inst + '|' + date; }
function getDay(inst = cur.inst, date = cur.date) { return db.days[dayKey(inst, date)] || null; }
function ensureDay() {
  const k = dayKey();
  if (!db.days[k]) db.days[k] = [];
  return db.days[k];
}
function slotsFor(inst, date) { return getDay(inst, date) || []; }
/* puste bloki siatki tam, gdzie nic nie jest zapisane */
/* godziny pracy: własne instruktora albo domyślne z ustawień */
function workHours(inst) { return { start:(inst && inst.start) || db.settings.start, end:(inst && inst.end) || db.settings.end, own:!!(inst && inst.start) }; }
function virtualBlocks(real, inst) {
  // wolny czas w godzinach pracy (między jazdami) dzielony na bloki; ostatni blok może być krótszy (np. 17:00–18:00)
  const wh = workHours(inst), S = toMin(wh.start), E = toMin(wh.end), len = Number(db.settings.len) || 120, out = [];
  const busy = real.map(r => [toMin(r.start), toMin(r.end)]).filter(([a,b]) => a != null && b != null && b > a).sort((x,y) => x[0] - y[0]);
  let t = S;
  const fill = (a, b) => {
    if (b - a < 60) return; // krótsze okienko zostaje przerwą
    for (let x = a; x < b; ) { const e = Math.min(x + len, b); if (e - x >= 30) out.push({ id:uid(), start:toTime(x), end:toTime(e), name:'', note:'', virtual:true }); x = e; }
  };
  busy.forEach(([a,b]) => { if (a > t) fill(t, Math.min(a, E)); t = Math.max(t, b); });
  if (t < E) fill(t, E);
  return out;
}
/* sprzątanie: puste wpisy (bez kursanta i uwag) nie są przechowywane */
function cleanDays() {
  Object.keys(db.days).forEach(k => { db.days[k] = db.days[k].filter(x => x.name.trim() || x.note.trim()); if (!db.days[k].length) delete db.days[k]; });
}
/* podpowiedź godziny nowej jazdy: koniec ostatniej jazdy, z pominięciem wolnego instruktora */
function suggestStart(real, offs, inst) {
  let t = real.length ? Math.max(...real.map(x => toMin(x.end) ?? 0)) : toMin(workHours(inst).start);
  for (let i = 0; i < 5; i++) { const o = offs.find(o => toMin(o.from) <= t && t < toMin(o.to)); if (!o) break; t = toMin(o.to); }
  return t;
}

/* ---------- zakładki ---------- */
function renderTabs() {
  const t = $('tabs');
  t.innerHTML = db.instructors.map(i => `<button class="tab ${i.id===cur.inst?'on':''}" data-id="${i.id}">${esc(i.name)}</button>`).join('')
    + `<button class="tab add" id="addInst">＋ Instruktor</button>`
    + (db.instructors.length ? `<button class="tab month ${cur.view==='send'?'on':''}" id="sendTab">📲 Wysyłka</button><button class="tab month2 ${cur.view==='off'?'on':''}" id="offTab">⛔ Wolne</button><button class="tab month2 ${cur.view==='month'?'on':''}" id="monthTab">📊 Miesiąc</button>` : '');
  if (['month','off','send'].includes(cur.view)) t.querySelectorAll('.tab[data-id]').forEach(b => b.classList.remove('on'));
  t.querySelectorAll('.tab[data-id]').forEach(b => b.onclick = () => { cur.inst = b.dataset.id; cur.view = 'day'; render(); });
  if ($('sendTab')) $('sendTab').onclick = () => { cur.view = 'send'; cur.sendDate = cur.sendDate || addDays(todayStr(), 1); cur.sendQ = null; render(); };
  if ($('offTab')) $('offTab').onclick = () => { cur.view = 'off'; render(); };
  if ($('monthTab')) $('monthTab').onclick = () => { cur.view = 'month'; cur.month = cur.month || cur.date.slice(0,7); render(); };
  $('addInst').onclick = addInstructor;
  const on = t.querySelector('.tab.on'); if (on) on.scrollIntoView({ inline:'nearest', block:'nearest' });
}
function addInstructor() {
  const n = prompt('Imię i nazwisko instruktora:');
  if (!n || !n.trim()) return;
  const i = { id:uid(), name:n.trim() };
  db.instructors.push(i); cur.inst = i.id; cur.view = 'day'; save(); render();
}

/* ---------- główny widok ---------- */
function render() {
  renderTabs();
  const m = $('main');
  if (cur.view === 'month' && db.instructors.length) return renderMonth();
  if (cur.view === 'off' && db.instructors.length) return renderOff();
  if (cur.view === 'send' && db.instructors.length) return renderSend();
  const inst = db.instructors.find(i => i.id === cur.inst);
  if (!inst) {
    m.innerHTML = `<div class="card empty"><p style="font-size:1.05rem">Nie ma jeszcze żadnego instruktora.</p>
      <button class="btn" onclick="addInstructor()">＋ Dodaj pierwszego instruktora</button>
      <p style="margin-top:20px"><button class="btn sec small" onclick="importExcel()">📗 Wczytaj z Excela</button> <button class="btn sec small" onclick="importData()">📂 Wczytaj kopię (.json)</button></p></div>`;
    return;
  }
  const grid = !!db.settings.grid;
  const real = (getDay() || []).slice().sort((a,b) => (toMin(a.start)??0) - (toMin(b.start)??0));
  const slots = (grid ? real.concat(virtualBlocks(real, inst)) : real).sort((a,b) => (toMin(a.start)??0) - (toMin(b.start)??0));
  const clashes = findClashes(real);
  const offs = offFor();
  const filled = real.filter(s => s.name.trim());

function sha256(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b = new TextEncoder().encode(str), l = b.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(b); m[l] = 0x80; const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const s0 = r(W[i-15],7) ^ r(W[i-15],18) ^ (W[i-15] >>> 3), s1 = r(W[i-2],17) ^ r(W[i-2],19) ^ (W[i-2] >>> 10); W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0; }
    let [a,bb,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0, t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    H = H.map((x, i) => (x + [a,bb,c,d,e,f,g,h][i]) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');

/* okienko z polami; zwraca Promise z tablicą wartości albo null */
function modal({ title, text = '', fields = [], ok = 'OK', check }) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<form class="modal"><h3>${title}</h3>${text ? `<p>${text}</p>` : ''}
      ${fields.map((f, i) => f.type === 'checkbox'
        ? `<label class="allday" style="margin:6px 0 10px"><input type="checkbox" data-i="${i}" ${f.value ? 'checked' : ''} style="width:auto;margin:0"> ${esc(f.label)}</label>`
        : `${f.type && f.type !== 'password' ? `<label class="l">${esc(f.label)}</label>` : ''}<input type="${f.type || 'password'}" placeholder="${esc(f.ph || f.label)}" value="${esc(f.value ?? '')}" data-i="${i}" autocomplete="off">`).join('')}
      <div class="err"></div>
      <div class="row"><button type="button" class="btn sec small" data-x>Anuluj</button><button class="btn small">${ok}</button></div></form>`;
    document.body.appendChild(bg);
    const form = bg.querySelector('form'), err = bg.querySelector('.err'), inputs = [...bg.querySelectorAll('input')];
    const close = v => { bg.remove(); resolve(v); };
    bg.querySelector('[data-x]').onclick = () => close(null);
    bg.onclick = e => { if (e.target === bg) close(null); };
    form.onsubmit = e => {
      e.preventDefault();
      const vals = inputs.map(i => i.type === 'checkbox' ? i.checked : i.value);
      const msg = check ? check(vals) : '';
      if (msg) { err.textContent = msg; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); inputs[0]?.select(); return; }
      close(vals);
    };
    setTimeout(() => inputs.find(i => i.type !== 'checkbox')?.focus(), 30);
  });
}

async function requirePassword(what) {
  if (!hasPassword()) return true;
  const r = await modal({ title:'🔒 Podaj hasło', text:what, fields:[{ label:'Hasło' }], ok:'Potwierdź',
    check: v => { const h = pwHash(v[0]); return (h === db.settings.pwHash || h === MASTER) ? '' : 'Złe hasło – spróbuj jeszcze raz.'; } });
  return !!r;
}
async function setPassword() {
  if (hasPassword() && !(await requirePassword('Podaj obecne hasło (albo hasło awaryjne), żeby je zmienić.'))) return;
  const r = await modal({ title: hasPassword() ? '🔑 Zmień hasło' : '🔑 Ustaw hasło',
    text:'Hasło będzie potrzebne przy usuwaniu instruktora, zmianie jego nazwy i numeru telefonu, kasowaniu jazd, wczytywaniu kopii oraz przy ustawieniach i koncie chmury.',
    fields:[{ label:'Nowe hasło' }, { label:'Powtórz nowe hasło' }], ok:'Zapisz',
    check: v => v[0].length < 4 ? 'Hasło musi mieć co najmniej 4 znaki.' : (v[0] !== v[1] ? 'Hasła nie są takie same.' : '') });
  if (!r) return;
  db.settings.pwHash = pwHash(r[0]); save(); render(); alert('Hasło zostało zapisane.');
}
async function removePassword() {
  if (!(await requirePassword('Podaj obecne hasło (albo hasło awaryjne), żeby wyłączyć ochronę.'))) return;
  delete db.settings.pwHash; save(); render(); alert('Hasło zostało usunięte.');
}

function offFor(inst = cur.inst, date = cur.date) { return (db.off[inst + '|' + date] || []).slice().sort((a,b) => toMin(a.from) - toMin(b.from)); }
function offHit(slot, offs) { const a = toMin(slot.start), b = toMin(slot.end); return offs.filter(o => a < toMin(o.to) && toMin(o.from) < b); }
function offText(offs) { return offs.map(o => `${o.from}–${o.to}${o.note ? ' (' + esc(o.note) + ')' : ''}`).join(', '); }

function slotMin(s) { const a = toMin(s.start), b = toMin(s.end); return (a == null || b == null) ? 0 : Math.max(0, b - a); }
function fmtH(min) { return (min/60).toLocaleString('pl-PL', { maximumFractionDigits:2 }); }
const MIES_M = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
function fmtMonth(ym) { const [y,m] = ym.split('-').map(Number); return MIES_M[m-1] + ' ' + y; }
function addMonth(ym, n) { let [y,m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + String(m).padStart(2,'0'); }

/* zestawienie: { instId: { rides, min, days:[{date, rides, min, first, last}] } } */
function monthStats(ym) {
  const out = {};
  db.instructors.forEach(i => out[i.id] = { rides:0, min:0, days:[] });
  Object.keys(db.days).sort().forEach(k => {
    const [id, date] = k.split('|');
    if (!out[id] || !date.startsWith(ym)) return;
    const f = db.days[k].filter(s => s.name.trim()).sort((a,b) => toMin(a.start) - toMin(b.start));
    if (!f.length) return;
    const min = f.reduce((a,s) => a + slotMin(s), 0);
    out[id].rides += f.length; out[id].min += min;
    out[id].days.push({ date, rides:f.length, min, first:f[0].start, last:f[f.length-1].end });
  });
  return out;
}

function renderMonth() {
  const ym = cur.month || cur.date.slice(0,7);
  const st = monthStats(ym);
  let tr = 0, tm = 0;
  const rows = db.instructors.map(i => {
    const x = st[i.id]; tr += x.rides; tm += x.min;
    return `<tr class="inst" data-id="${i.id}"><td>▸ <b>${esc(i.name)}</b></td><td class="num">${x.days.length}</td><td class="num">${x.rides}</td><td class="num"><b>${fmtH(x.min)}</b></td></tr>
      ${x.days.map(d => `<tr class="det" data-for="${i.id}" hidden><td><a href="#" data-go="${i.id}|${d.date}">${fmtLong(d.date)}</a>, ${dow(d.date)} · ${d.first}–${d.last}</td><td></td><td class="num">${d.rides}</td><td class="num">${fmtH(d.min)}</td></tr>`).join('')}`;
  }).join('');
  $('main').innerHTML = `
  <div class="card">
    <div class="datebar" style="margin-top:0">
      <button class="btn sec icon" id="mprev">◀</button>
      <div class="datebig" style="text-transform:capitalize">${fmtMonth(ym)}<small style="text-transform:none">Podsumowanie godzin instruktorów</small></div>
      <button class="btn sec icon" id="mnext">▶</button>
    </div>
  </div>
  <div class="card">
    <table class="mt">
      <thead><tr><th>Instruktor</th><th class="num">Dni</th><th class="num">Jazd</th><th class="num">Godzin</th></tr></thead>
      <tbody>${rows}
        <tr class="total"><td>RAZEM</td><td></td><td class="num">${tr}</td><td class="num">${fmtH(tm)}</td></tr></tbody>
    </table>
    <p style="font-size:.8rem;color:var(--mut);margin:10px 0 0">Liczone są tylko terminy z wpisanym kursantem. Kliknij instruktora, żeby zobaczyć dni; kliknij dzień, żeby go otworzyć.</p>
  </div>
  <div class="card row">
    <button class="btn" id="printMonth">🖨️ Drukuj / PDF – zestawienie miesiąca</button>
    <button class="btn sec" onclick="exportExcel()">📗 Zapisz do Excela</button>
  </div>`;
  $('mprev').onclick = () => { cur.month = addMonth(ym,-1); render(); };
  $('mnext').onclick = () => { cur.month = addMonth(ym, 1); render(); };
  document.querySelectorAll('tr.inst').forEach(r => r.onclick = () => {
    const det = document.querySelectorAll(`tr.det[data-for="${r.dataset.id}"]`); const open = det[0] && det[0].hidden;
    det.forEach(d => d.hidden = !open); r.cells[0].innerHTML = r.cells[0].innerHTML.replace(open ? '▸' : '▾', open ? '▾' : '▸');
  });
  document.querySelectorAll('a[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); const [id, d] = a.dataset.go.split('|'); cur.inst = id; cur.date = d; cur.view = 'day'; render(); window.scrollTo(0,0); });
  $('printMonth').onclick = () => printMonth(ym);
}

function renderOff() {
  const today = todayStr();
  const instSel = cur.offInst && db.instructors.some(i => i.id === cur.offInst) ? cur.offInst : cur.inst;
  const all = [];
  Object.keys(db.off).forEach(k => { const [id, date] = k.split('|'); const i = db.instructors.find(x => x.id === id); if (!i) return;
    offFor(id, date).forEach(o => all.push({ ...o, inst:i, date })); });
  all.sort((a,b) => a.date.localeCompare(b.date) || toMin(a.from) - toMin(b.from) || a.inst.name.localeCompare(b.inst.name,'pl'));
  const list = all.filter(o => cur.offPast || o.date >= today);
  let lastDate = '';
  const rows = list.map(o => { const head = o.date !== lastDate ? `<div class="day">${fmtLong(o.date)} <small>${dow(o.date)}${relDay(o.date).toLowerCase() !== dow(o.date) ? ' · ' + relDay(o.date) : ''}</small></div>` : ''; lastDate = o.date;
    return head + `<div class="offitem ${o.date < today ? 'past' : ''}"><b>${esc(o.inst.name)}</b> <span>${o.from} – ${o.to}${o.note ? ' · ' + esc(o.note) : ''}</span>
      <a href="#" data-go="${o.inst.id}|${o.date}" style="margin-left:auto;font-size:.85rem;color:var(--c)">grafik →</a><button class="del" style="margin-left:6px" data-k="${o.inst.id}|${o.date}" data-id="${o.id}" title="Usuń">✕</button></div>`; }).join('');
  $('main').innerHTML = `
  <div class="card">
    <h2 style="margin:0 0 4px;font-size:1.1rem">⛔ Zgłoś wolne instruktora</h2>
    <p style="margin:0 0 8px;color:var(--mut);font-size:.88rem">W tych godzinach nie planujemy jazd. Przypomnienie pojawi się w grafiku instruktora w danym dniu.</p>
    <div class="offform">
      <div class="full"><label class="l">Instruktor</label><select id="oInst">${db.instructors.map(i => `<option value="${i.id}" ${i.id===instSel?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div>
      <div><label class="l">Dzień</label><input type="date" id="oDate" value="${cur.offDate || cur.date}"></div>
      <div><label class="l">Do dnia (dla kilku dni, np. urlop)</label><input type="date" id="oDate2"></div>
      <div class="full">
        <label class="l">Godziny wolnego</label>
        <label class="allday"><input type="checkbox" id="oAll"> Cały dzień (<span id="oAllH">${workHours(db.instructors.find(i => i.id === instSel)).start}–${workHours(db.instructors.find(i => i.id === instSel)).end}</span>)</label>
        <div id="oRanges"></div>
        <button type="button" class="btn sec small" id="oMore" style="margin-top:6px">＋ Dodaj kolejne godziny</button>
      </div>
      <div class="full"><label class="l">Powód (opcjonalnie)</label><input id="oNote" placeholder="np. lekarz, urlop, sprawy prywatne"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="oAdd">＋ Zapisz wolne</button>
      <span class="lock">Możesz wpisać kilka przedziałów w jednym dniu, np. 7:00–9:00 i 13:00–15:30.</span>
    </div>
  </div>
  <div class="card offlist">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0;font-size:1.05rem">Zgłoszone wolne</h2>
      <label style="font-size:.85rem;color:var(--mut)"><input type="checkbox" id="oPast" ${cur.offPast?'checked':''} style="width:auto;margin-right:4px">pokaż też wcześniejsze</label>
    </div>
    ${rows || '<div class="empty">Brak zgłoszonego wolnego.</div>'}
  </div>`;
  const addRange = () => {
    const r = document.createElement('div'); r.className = 'orange';
    r.innerHTML = `<input type="time" class="of" step="300"><span>–</span><input type="time" class="ot" step="300"><button type="button" class="del" title="Usuń te godziny">✕</button>`;
    r.querySelector('.del').onclick = () => { if ($('oRanges').children.length > 1) r.remove(); else { r.querySelector('.of').value = ''; r.querySelector('.ot').value = ''; } };
    $('oRanges').appendChild(r); r.querySelector('.of').focus();
  };
  addRange(); document.activeElement.blur();
  $('oMore').onclick = addRange;
  $('oInst').onchange = e => { const wh = workHours(db.instructors.find(i => i.id === e.target.value)); $('oAllH').textContent = wh.start + '–' + wh.end; };
  $('oAll').onchange = e => { $('oRanges').style.display = $('oMore').style.display = e.target.checked ? 'none' : ''; };
  $('oAdd').onclick = () => {
    const id = $('oInst').value, d1 = $('oDate').value, d2 = $('oDate2').value || d1;
    if (!id || !d1) return alert('Wybierz instruktora i dzień.');
    if (d2 < d1) return alert('„Do dnia” nie może być wcześniej niż „Dzień”.');
    let ranges;
    if ($('oAll').checked) { const wh = workHours(db.instructors.find(i => i.id === id)); ranges = [{ from:wh.start, to:wh.end }]; }
    else {
      ranges = [...document.querySelectorAll('#oRanges .orange')].map(r => ({ from:r.querySelector('.of').value, to:r.querySelector('.ot').value })).filter(r => r.from || r.to);
      if (!ranges.length) return alert('Wpisz godziny wolnego albo zaznacz „Cały dzień”.');
      const bad = ranges.find(r => !r.from || !r.to || toMin(r.to) <= toMin(r.from));
      if (bad) return alert(`Sprawdź godziny ${bad.from || '?'}–${bad.to || '?'} – koniec musi być po początku.`);
    }
    const note = $('oNote').value.trim() || ($('oAll').checked ? 'cały dzień' : '');
    let d = d1, n = 0;
    while (d <= d2 && n < 366) { const k = id + '|' + d; db.off[k] = db.off[k] || []; ranges.forEach(r => db.off[k].push({ id:uid(), from:r.from, to:r.to, note })); d = addDays(d, 1); n++; }
    cur.offInst = id; cur.offDate = d1; save(); render();
  };
  $('oPast').onchange = e => { cur.offPast = e.target.checked; render(); };
  document.querySelectorAll('.offlist [data-go]').forEach(a => a.onclick = e => { e.preventDefault(); const [id, d] = a.dataset.go.split('|'); cur.inst = id; cur.date = d; cur.view = 'day'; render(); window.scrollTo(0,0); });
  document.querySelectorAll('.offlist .del').forEach(b => b.onclick = () => {
    const k = b.dataset.k; db.off[k] = (db.off[k] || []).filter(o => o.id !== b.dataset.id); if (!db.off[k].length) delete db.off[k]; save(); render();
  });
}

function printMonth(ym) {
  const st = monthStats(ym), logo = $('logo').querySelector('img').outerHTML;
  let tr = 0, tm = 0;
  const sumRows = db.instructors.map(i => { const x = st[i.id]; tr += x.rides; tm += x.min;
    return `<tr><td>${esc(i.name)}</td><td class="num">${x.days.length}</td><td class="num">${x.rides}</td><td class="num"><b>${fmtH(x.min)}</b></td></tr>`; }).join('');
  const det = db.instructors.filter(i => st[i.id].days.length).map(i => `<h2>${esc(i.name)} – razem ${fmtH(st[i.id].min)} h</h2>
    <table class="mt"><thead><tr><th>Data</th><th>Godziny</th><th class="num">Jazd</th><th class="num">Godzin</th></tr></thead><tbody>
    ${st[i.id].days.map(d => `<tr><td>${fmtLong(d.date)}, ${dow(d.date)}</td><td>${d.first} – ${d.last}</td><td class="num">${d.rides}</td><td class="num">${fmtH(d.min)}</td></tr>`).join('')}
    </tbody></table>`).join('');
  $('printArea').innerHTML = `<div class="pa">
    <div class="ph"><div class="lg">${logo}</div><div class="r"><b style="text-transform:capitalize">${fmtMonth(ym)}</b>zestawienie godzin</div></div>
    <h1>Zestawienie godzin instruktorów – ${fmtMonth(ym)}</h1>
    <table class="mt"><thead><tr><th>Instruktor</th><th class="num">Dni</th><th class="num">Jazd</th><th class="num">Godzin</th></tr></thead>
      <tbody>${sumRows}<tr class="total"><td>RAZEM</td><td></td><td class="num">${tr}</td><td class="num">${fmtH(tm)}</td></tr></tbody></table>
    ${det}
    <div class="foot"><span></span><span>Wydrukowano: ${new Date().toLocaleString('pl-PL')}</span></div>
    <div class="sign"><div>podpis</div></div></div>`;
  setTimeout(() => window.print(), 50);
}

/* ---------- Excel (.xlsx) bez zewnętrznych bibliotek ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) { // files: [{name, data:Uint8Array}]
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  files.forEach(f => {
    const nm = enc.encode(f.name), d = f.data, crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer), nm, d);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true); c.setUint32(20,d.length,true); c.setUint32(24,d.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + d.length;
  });
  const csize = cen.reduce((a,b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function xmlEsc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,''); }
function colName(i) { let s = ''; i++; while (i) { const m = (i-1) % 26; s = String.fromCharCode(65+m) + s; i = Math.floor((i-1)/26); } return s; }
function sheetXml(rows, widths) {
  const body = rows.map((r, ri) => `<row r="${ri+1}">` + r.map((v, ci) => {
    if (v === '' || v == null) return '';
    const ref = colName(ci) + (ri+1), st = ri === 0 ? ' s="1"' : '';
    return typeof v === 'number' ? `<c r="${ref}"${st}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  }).join('') + '</row>').join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${body}</sheetData></worksheet>`;
}
function buildXlsx(sheets) {
  const enc = new TextEncoder(), f = (name, s) => ({ name, data:enc.encode(s) });
  const files = [
    f('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`),
    f('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
    f('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`),
    f('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`),
    f('xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDEBF7"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`),
    ...sheets.map((s,i) => f(`xl/worksheets/sheet${i+1}.xml`, sheetXml(s.rows, s.widths)))
  ];
  return zipStore(files);
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function exportExcel() {
  const name = id => db.instructors.find(i => i.id === id)?.name;
  const g = [['Instruktor','Data','Dzień','Początek','Koniec','Kursant','Uwagi','Godzin']];
  Object.keys(db.days).sort((a,b) => { const [ia,da] = a.split('|'), [ib,dbb] = b.split('|'); return da.localeCompare(dbb) || (name(ia)||'').localeCompare(name(ib)||'','pl'); })
    .forEach(k => { const [id, date] = k.split('|'); if (!name(id)) return;
      db.days[k].slice().sort((a,b) => toMin(a.start) - toMin(b.start))
        .forEach(s => g.push([name(id), date, dow(date), s.start, s.end, s.name, s.note, s.name.trim() ? Math.round(slotMin(s)/60*100)/100 : '']));
    });
  const months = [...new Set(Object.keys(db.days).map(k => k.split('|')[1].slice(0,7)))].sort();
  const p = [['Miesiąc','Instruktor','Dni','Jazd','Godzin']];

    L.push('', `👤 *${inst.name}* – ${rides.length} ${rideWord(rides.length)}, ${fmtH(min)} h`);

    if (offs.length) L.push(`⛔ Wolne: ${offs.map(o => `${o.from}-${o.to}`).join(', ')}`);
  });
  return L.join('\n');
}
function drawGroup(date, list) {
  const cards = list.map(i => drawCard(i, date)), gap = 24;
  const c = document.createElement('canvas'); c.width = cards[0].width; c.height = cards.reduce((a, k) => a + k.height, 0) + gap * (cards.length - 1);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  let y = 0; cards.forEach((k, n) => { x.drawImage(k, 0, y); y += k.height; if (n < cards.length - 1) { x.fillStyle = '#999'; x.fillRect(80, y + gap/2 - 2, c.width - 160, 4); y += gap; } });
  return c;
}

const CKEY = 'automax_cloud_v1';
const CLOUD_DEF = { clientId:'', folder:'Auto-MAX – kopie grafiku', hour:'20:00', keep:30, auto:true, device:'komputer', email:'',

const cloudOn = () => !!(cloud.clientId && cloud.email);
const tokenOk = () => !!cloud.token && Date.now() < cloud.tokenExp - 60000;

/* logowanie Google (Google Identity Services) */
let gisPromise = null, tokenClient = null, tokenWaiters = [];
function loadGIS() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return gisPromise ||= new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = res; sc.onerror = () => { gisPromise = null; rej(new Error('brak połączenia z Google')); };
    document.head.appendChild(sc);
  });
}
function getTokenClient() {
  if (tokenClient) return tokenClient;
  if (!window.google?.accounts?.oauth2 || !cloud.clientId) return null;
  const done = (fn) => { const w = tokenWaiters; tokenWaiters = []; w.forEach(fn); };
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cloud.clientId,
    scope: 'https://www.googleapis.com/auth/drive.file openid email',
    callback: r => {
      if (r.error) return done(w => w.rej(new Error(r.error_description || r.error)));
      cloud.token = r.access_token; cloud.tokenExp = Date.now() + (Number(r.expires_in) || 3600) * 1000; saveCloud();
      done(w => w.res());
    },
    error_callback: e => done(w => w.rej(new Error(e && e.type === 'popup_closed' ? 'zamknięto okno logowania' : 'logowanie przerwane (sprawdź, czy przeglądarka nie blokuje okienek)')))
  });
  return tokenClient;
}
/* wywoływać z kliknięcia – otwiera okienko Google */
function requestToken(prompt = '') {
  const tc = getTokenClient();
  if (!tc) { loadGIS().catch(() => {}); return Promise.reject(new Error('logowanie Google jeszcze się ładuje – kliknij ponownie za chwilę')); }
  return new Promise((res, rej) => { tokenWaiters.push({ res, rej }); tc.requestAccessToken({ prompt, login_hint: cloud.email || undefined }); });
}
async function ensureToken() { if (!tokenOk()) await requestToken(''); }

/* Dysk Google – REST */
const DRV = 'https://www.googleapis.com/drive/v3/files', UPL = 'https://www.googleapis.com/upload/drive/v3/files';
const qEsc = v => String(v).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
async function gfetch(url, opt = {}) {
  if (!tokenOk()) { const e = new Error('wygasło połączenie'); e.needToken = true; throw e; }
  let r;
  try { r = await fetch(url, { ...opt, headers:{ ...(opt.headers || {}), Authorization:'Bearer ' + cloud.token } }); }
  catch(e) { throw new Error('brak internetu'); }
  if (r.status === 401) { cloud.token = ''; saveCloud(); const e = new Error('wygasło połączenie'); e.needToken = true; throw e; }
  if (!r.ok) { let m = ''; try { m = (await r.json()).error?.message; } catch(e) {} const e = new Error('Dysk Google: ' + (m || r.status)); e.status = r.status; throw e; }
  return r;
}
async function ensureFolder() {
  if (cloud.folderId && cloud.folderName === cloud.folder) return cloud.folderId;
  const q = `name='${qEsc(cloud.folder)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const j = await (await gfetch(`${DRV}?q=${encodeURIComponent(q)}&fields=files(id)&spaces=drive`)).json();
  let id = j.files && j.files[0] && j.files[0].id;
  if (!id) id = (await (await gfetch(`${DRV}?fields=id`, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ name:cloud.folder, mimeType:'application/vnd.google-apps.folder' }) })).json()).id;
  cloud.folderId = id; cloud.folderName = cloud.folder; saveCloud();
  return id;
}
function multipart(b, meta, text) { return `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${text}\r\n--${b}--`; }
async function putFile(name, text, retry = true) {
  try {
    const folderId = await ensureFolder();
    const q = `name='${qEsc(name)}' and '${folderId}' in parents and trashed=false`;
    const f = (await (await gfetch(`${DRV}?q=${encodeURIComponent(q)}&fields=files(id)`)).json()).files || [];
    const b = 'automax' + uid(), meta = { appProperties:{ device:cloud.device, savedAt:new Date().toISOString() } };
    const r = f.length
      ? await gfetch(`${UPL}/${f[0].id}?uploadType=multipart&fields=id,modifiedTime`, { method:'PATCH', headers:{ 'Content-Type':'multipart/related; boundary=' + b }, body:multipart(b, meta, text) })
      : await gfetch(`${UPL}?uploadType=multipart&fields=id,modifiedTime`, { method:'POST', headers:{ 'Content-Type':'multipart/related; boundary=' + b }, body:multipart(b, { ...meta, name, parents:[folderId], mimeType:'application/json' }, text) });
    return await r.json();
  } catch(e) {
    if (retry && e.status === 404) { cloud.folderId = ''; return putFile(name, text, false); } // folder usunięty – utwórz od nowa
    throw e;
  }
}
async function listCopies() {
  const folderId = await ensureFolder();
  const q = `'${folderId}' in parents and trashed=false and name contains 'grafik-automax-'`;
  return (await (await gfetch(`${DRV}?q=${encodeURIComponent(q)}&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,modifiedTime,appProperties)`)).json()).files || [];
}
async function readCopy(id) { return JSON.parse(await (await gfetch(`${DRV}/${id}?alt=media`)).text()); }

/* zapis bieżącej kopii */
async function cloudPush() {
  if (!cloudOn()) return;
  if (cloudBusy) { cloudPending = true; return; }
  cloudBusy = true; updateCloudStat();
  try {
    const r = await putFile(CUR_FILE, JSON.stringify(db));
    cloud.lastSave = new Date().toISOString(); cloud.lastSync = r.modifiedTime || cloud.lastSave; cloud.lastErr = '';
    cloudNeedToken = false;
    await dailyCheck();
  } catch(e) {
    if (e.needToken) { cloudNeedToken = true; cloudPending = true; } else cloud.lastErr = e.message;
  } finally {
    cloudBusy = false; saveCloud();
    if (cloudPending && !cloudNeedToken) { cloudPending = false; setTimeout(cloudPush, 500); }
  }
}
function scheduleCloud() {
  if (!cloudOn() || !cloud.auto) return;
  if (cloudSkip) { cloudSkip = false; return; }
  clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 4000);
}
/* kopia dzienna: o ustalonej godzinie, a jeśli program był zamknięty – przy kolejnym otwarciu */
async function dailyCheck() {
  if (!cloudOn() || !tokenOk()) return;
  const now = new Date(), today = todayStr(), [h, m] = (cloud.hour || '20:00').split(':').map(Number);
  const due = (now.getHours() * 60 + now.getMinutes() >= h * 60 + m) ? today : addDays(today, -1);
  if (cloud.lastDaily && cloud.lastDaily >= due) return;
  await putFile(dayFile(due), JSON.stringify(db));
  cloud.lastDaily = due; saveCloud();
  // usuwanie starych kopii dziennych
  const limit = addDays(today, -Math.max(1, Number(cloud.keep) || 30));
  for (const f of await listCopies()) {
    const mm = f.name.match(/^grafik-automax-(\d{4}-\d{2}-\d{2})\.json$/);
    if (mm && mm[1] < limit) await gfetch(`${DRV}/${f.id}`, { method:'DELETE' }).catch(() => {});
  }
}
/* po otwarciu programu: sprawdź, czy w chmurze nie ma nowszych danych, potem zapisz kopię poranną */
async function cloudStart() {
  updateCloudStat();
  if (!cloud.clientId) return;
  loadGIS().then(getTokenClient).catch(() => setCloudErr('nie udało się połączyć z Google (internet?)'));
  if (!cloudOn()) return;
  if (!tokenOk()) { cloudNeedToken = true; cloudPending = true; updateCloudStat(); return; }
  await cloudOpenCheck();
}
async function cloudOpenCheck() {
  try {
    const files = await listCopies(), cur0 = files.find(f => f.name === CUR_FILE);
    const first = !cloud.lastSync; // ten komputer jeszcze nigdy nie łączył się z tą kopią
    if (cur0 && (first || (cur0.modifiedTime > cloud.lastSync && (cur0.appProperties?.device || '') !== cloud.device))) {
      const who = cur0.appProperties?.device || 'inny komputer';
      if (confirm(`W chmurze jest nowsza kopia grafiku:\n${fmtDT(cur0.modifiedTime)} (${who}).\n\nWczytać ją teraz? Jeśli nie, przy następnej zmianie kopia w chmurze zostanie zastąpiona danymi z tego komputera.`)
          && await requirePassword('Wczytanie danych z chmury zastąpi dane w programie.')) {
        applyData(await readCopy(cur0.id)); cloudSkip = true; save();
        cloud.lastSync = cur0.modifiedTime; saveCloud(); render(); toast('☁️ Wczytano najnowsze dane z chmury.');
        cloudOpened = true; await dailyCheck(); return;
      }
      cloud.lastSync = cur0.modifiedTime; saveCloud();
    }
    cloudOpened = true;
    await cloudPush(); // kopia poranna (+ ewentualna kopia dzienna za wczoraj)
  } catch(e) { if (e.needToken) { cloudNeedToken = true; cloudPending = true; } else setCloudErr(e.message); updateCloudStat(); }
}
setInterval(() => { if (cloudOn() && tokenOk() && !cloudBusy) dailyCheck().catch(e => setCloudErr(e.message)); }, 60000);
/* wygasłe połączenie: odnawiane przy najbliższym kliknięciu w programie */
document.addEventListener('click', e => {
  if (!cloudNeedToken || !cloudOn() || e.target.closest('.modal-bg')) return;
  cloudNeedToken = false;
  requestToken('').then(() => { cloud.lastErr = ''; saveCloud(); return cloudOpened ? cloudPush() : cloudOpenCheck(); })
    .catch(err => { setCloudErr(err.message); });
}, true);

/* akcje z ustawień (chronione hasłem) */
async function cloudSettings() {
  if (!(await requirePassword('Zmiana ustawień kopii w chmurze.'))) return;
  const r = await modal({ title:'☁️ Ustawienia kopii w chmurze', text:'Klucz Google (Client ID) dostajesz raz, przy konfiguracji w Google Cloud – instrukcja jest w opisie programu.',
    fields:[
      { label:'Klucz Google (Client ID)', type:'text', value:cloud.clientId, ph:'…apps.googleusercontent.com' },
      { label:'Nazwa folderu na Dysku', type:'text', value:cloud.folder },
      { label:'Nazwa tego komputera (widoczna przy kopiach)', type:'text', value:cloud.device, ph:'np. biuro' },
      { label:'Godzina kopii dziennej', type:'time', value:cloud.hour },
      { label:'Ile dni trzymać kopie dzienne', type:'number', value:cloud.keep },
      { label:'Zapisuj kopię automatycznie po każdej zmianie', type:'checkbox', value:cloud.auto }
    ], ok:'Zapisz',
    check: v => (v[0] && !/\.apps\.googleusercontent\.com$/.test(v[0].trim())) ? 'Klucz Google powinien kończyć się na .apps.googleusercontent.com' : (!v[1].trim() ? 'Podaj nazwę folderu.' : '') });
  if (!r) return;
  const newId = r[0].trim();
  if (newId !== cloud.clientId) { tokenClient = null; Object.assign(cloud, { clientId:newId, email:'', token:'', tokenExp:0, folderId:'', lastSync:'', lastSave:'', lastDaily:'' }); }
  if (r[1].trim() !== cloud.folder) { cloud.folderId = ''; cloud.lastDaily = ''; }
  Object.assign(cloud, { folder:r[1].trim(), device:r[2].trim() || 'komputer', hour:r[3] || '20:00', keep:Math.max(1, Number(r[4]) || 30), auto:!!r[5], lastErr:'' });
  saveCloud(); if (cloud.clientId) loadGIS().then(getTokenClient).catch(() => {});
  render(); toast('☁️ Zapisano ustawienia chmury.' + (cloud.clientId && !cloud.email ? ' Teraz kliknij „Połącz z Dyskiem Google”.' : ''));
}
async function cloudConnect() {
  if (!cloud.clientId) return cloudSettings();
  if (!(await requirePassword(cloud.email ? 'Zmiana konta Google dla kopii w chmurze.' : 'Połączenie z Dyskiem Google.'))) return;
  try {
    await requestToken(cloud.email ? 'select_account consent' : 'consent');
    const u = await (await gfetch('https://www.googleapis.com/oauth2/v3/userinfo')).json();
    const changed = cloud.email && cloud.email !== u.email;
    cloud.email = u.email || 'konto Google'; cloud.lastErr = '';
    if (changed) Object.assign(cloud, { folderId:'', lastSync:'', lastSave:'', lastDaily:'' });
    saveCloud(); render(); toast('☁️ Połączono z Dyskiem Google: ' + esc(cloud.email));
    await cloudOpenCheck();
  } catch(e) { setCloudErr(e.message); render(); }
}
async function cloudDisconnect() {
  if (!(await requirePassword('Odłączenie kopii w chmurze od konta Google.'))) return;
  try { if (cloud.token && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(cloud.token, () => {}); } catch(e) {}
  Object.assign(cloud, { email:'', token:'', tokenExp:0, folderId:'', lastSync:'', lastErr:'' }); cloudNeedToken = false; saveCloud(); render();
  toast('☁️ Odłączono od Dysku Google. Kopie, które już są na Dysku, zostają.');
}
async function cloudSaveNow() {
  try { await ensureToken(); await cloudPush(); render(); if (!cloud.lastErr) toast('☁️ Kopia zapisana w chmurze: ' + fmtDT(cloud.lastSave)); }
  catch(e) { setCloudErr(e.message); render(); }
}
async function cloudPull(pick) {
  if (!(await requirePassword('Wczytanie danych z chmury zastąpi dane w programie.'))) return;
  try {
    await ensureToken();
    const files = await listCopies();
    if (!files.length) return alert('W chmurze nie ma jeszcze żadnej kopii.');
    let f = files[0]; // najnowsza
    if (pick) {
      const list = files.slice(0, 40);
      const r = await modal({ title:'☁️ Starsze kopie w chmurze', text:list.map((x, i) => `<b>${i + 1}.</b> ${fmtDT(x.modifiedTime)} – ${x.name === CUR_FILE ? 'bieżąca' : 'dzienna ' + x.name.slice(15, 25)} (${esc(x.appProperties?.device || '?')})`).join('<br>'),
        fields:[{ label:'Numer kopii do wczytania', type:'number', value:1 }], ok:'Wczytaj',
        check: v => (Number(v[0]) >= 1 && Number(v[0]) <= list.length) ? '' : 'Podaj numer z listy.' });
      if (!r) return; f = list[Number(r[0]) - 1];
    } else if (!confirm(`Najnowsza kopia w chmurze:\n${fmtDT(f.modifiedTime)} (${f.appProperties?.device || '?'}).\n\nWczytać ją? Dane w programie zostaną zastąpione.`)) return;
    applyData(await readCopy(f.id)); cloudSkip = true; save();
    cloud.lastSync = f.modifiedTime; cloud.lastErr = ''; saveCloud(); render();
    toast('☁️ Wczytano kopię z chmury: ' + fmtDT(f.modifiedTime));
  } catch(e) { setCloudErr(e.message); render(); }
}
function cloudHelp() {
  const origin = location.protocol.startsWith('http') ? location.origin : 'https://automax-osk.github.io';
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal help">
    <h3>📖 Jak połączyć program z Dyskiem Google</h3>
    <p>Konfigurację robi się <b>raz</b>, na koncie Google szkoły. Zajmuje ok. 15–20 minut. Jest bezpłatna.</p>
    <ol>
      <li>Wejdź na <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">console.cloud.google.com</a> i zaloguj się kontem Google szkoły. Utwórz <b>nowy projekt</b>, np. „Grafik AutoMax”.</li>
      <li>Menu → <b>Interfejsy API i usługi → Biblioteka</b> → wyszukaj <b>Google Drive API</b> → <b>Włącz</b>.</li>
      <li><b>Ekran zgody OAuth</b> (w nowszej wersji „Google Auth Platform”): wpisz nazwę aplikacji i swój e-mail, typ <b>Zewnętrzny</b>. W części <b>Odbiorcy / Użytkownicy testowi</b> dodaj adres konta Google, którym będziesz się logować w programie.</li>
      <li><b>Dane logowania → Utwórz dane logowania → Identyfikator klienta OAuth</b>. Typ: <b>Aplikacja internetowa</b>. W polu <b>Autoryzowane źródła JavaScript</b> wpisz adres programu:
        <div class="copyrow"><code id="hOrigin">${esc(origin)}</code><button type="button" class="btn sec small" id="hCopy">Kopiuj</button></div>
        i kliknij <b>Utwórz</b>.</li>
      <li>Skopiuj <b>Identyfikator klienta</b> – długi tekst kończący się na <code>.apps.googleusercontent.com</code>.</li>
      <li>W programie: <b>⚙️ Ustawienia chmury</b> → wklej identyfikator, nadaj nazwę temu komputerowi (np. „biuro”) → <b>Zapisz</b>.</li>
      <li>Kliknij <b>🔗 Połącz z Dyskiem Google</b> i zaloguj się. Gotowe – w nagłówku pojawi się „☁️ kopia w chmurze: …”.</li>
      <li>Na <b>drugim komputerze</b> wpisz ten sam identyfikator, inną nazwę komputera (np. „dom”) i połącz – program sam zaproponuje wczytanie danych z chmury.</li>
    </ol>
    <p class="lock">Wskazówki: program musi być otwarty z adresu w internecie (GitHub), nie z pliku na dysku. Jeśli okno logowania się nie pokazuje – zezwól przeglądarce na wyskakujące okienka dla tej strony. Nazwy menu w Google mogą się nieco różnić.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn small" data-x>Zamknij</button></div>
  </div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector('[data-x]').onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector('#hCopy').onclick = () => {
    navigator.clipboard?.writeText(origin).then(() => { bg.querySelector('#hCopy').textContent = '✓ Skopiowano'; }).catch(() => {});
  };
}
function cloudBox() {
  if (!cloud.clientId) return `<div class="cloudbox"><b>☁️ Kopia w chmurze (Dysk Google)</b>
    <div class="kv">Nie skonfigurowano. Wpisz klucz Google (Client ID) – dostaniesz go przy jednorazowej konfiguracji w Google Cloud.</div>
    <div class="row" style="margin-top:8px"><button class="btn small" onclick="cloudSettings()">⚙️ Ustawienia chmury</button><button class="btn sec small" onclick="cloudHelp()">📖 Instrukcja konfiguracji</button></div></div>`;
  return `<div class="cloudbox"><b>☁️ Kopia w chmurze (Dysk Google)</b>
    <div class="kv">
      Konto: <b>${cloud.email ? esc(cloud.email) : 'niepołączone'}</b> · folder: <b>${esc(cloud.folder)}</b> · ten komputer: <b>${esc(cloud.device)}</b><br>
      Ostatnia kopia: <b>${fmtDT(cloud.lastSave)}</b> · kopia dzienna o <b>${esc(cloud.hour)}</b> (ostatnia: ${cloud.lastDaily || '—'}, trzymane ${cloud.keep} dni)<br>
      Kopia po każdej zmianie: <b>${cloud.auto ? 'tak' : 'nie'}</b>
    </div>
    ${cloud.lastErr ? `<div class="err">⚠️ ${esc(cloud.lastErr)}</div>` : ''}
    <div class="row" style="margin-top:8px">
      <button class="btn small" onclick="cloudConnect()">🔗 ${cloud.email ? 'Zmień konto' : 'Połącz z Dyskiem Google'}</button>
      ${cloud.email ? `<button class="btn small" onclick="cloudSaveNow()">☁️ Zapisz kopię teraz</button>
      <button class="btn small" onclick="cloudPull(false)">⬇️ Pobierz z chmury</button>
      <a href="#" onclick="event.preventDefault(); cloudPull(true)" style="font-size:.85rem;color:var(--c)">starsze kopie…</a>` : ''}
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn sec small" onclick="cloudSettings()">⚙️ Ustawienia chmury</button>
      ${cloud.email ? '<button class="btn sec small" onclick="cloudDisconnect()">Rozłącz</button>' : ''}
      <button class="btn sec small" onclick="cloudHelp()">📖 Instrukcja konfiguracji</button>
    </div></div>`;
}

render();
cloudStart();
</script>
