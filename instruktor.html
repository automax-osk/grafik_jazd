<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mój grafik jazd w AutoMax</title>

<link rel="manifest" href="instruktor.webmanifest">

<meta name="application-name" content="Mój grafik jazd w AutoMax">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1565c0">

<style>
  :root { --c:#1565c0; --bg:#f3f5f8; --card:#fff; --txt:#1c2430; --mut:#6b7686; --ok:#2e7d32; --err:#c62828; --line:#e3e8ef; --off:#fff3e0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--c); color:#fff; padding:12px 14px 12px; text-align:center; }
  .logo { background:#a5daf4; border-radius:10px; padding:5px 6px 4px; display:inline-block; margin-bottom:6px; width:260px; max-width:80%; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .logo img { display:block; width:100%; border-radius:6px; }
  .credit { font-size:min(.66rem, 2.7vw); font-style:italic; font-weight:600; color:#2d2482; text-align:center; margin:0 0 3px; white-space:nowrap; overflow:hidden; }
  .credit .fb { width:13px; height:13px; vertical-align:-2px; margin:0 3px 0 2px; }
  h1 { margin:2px 0 0; font-size:1.15rem; }
  .upd { font-size:.78rem; opacity:.85; margin-top:3px; }
  main { max-width:560px; margin:0 auto; padding:10px 10px 40px; }
  .seg { display:flex; gap:6px; margin-bottom:10px; }
  .seg button { flex:1; border:0; border-radius:10px; padding:11px 6px; font-size:1rem; font-weight:600; background:#fff; color:var(--c); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .seg button.on { background:var(--c); color:#fff; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .dbar { display:flex; align-items:center; gap:8px; }
  .dbar button { border:0; background:#e8eef7; color:var(--c); border-radius:10px; width:44px; height:44px; font-size:1.1rem; flex:0 0 auto; }
  .dbar .d { flex:1; text-align:center; font-weight:700; font-size:1.05rem; }
  .dbar .d small { display:block; font-weight:500; color:var(--mut); font-size:.85rem; }
  .ride { display:flex; gap:12px; padding:10px 2px; border-top:1px solid var(--line); align-items:flex-start; }
  .ride:first-child { border-top:0; }
  .tm { font-weight:700; color:var(--c); min-width:92px; font-variant-numeric:tabular-nums; }
  .tm small { display:block; color:var(--mut); font-weight:500; font-size:.78rem; }
  .who { flex:1; min-width:0; }
  .who b { font-size:1.02rem; }
  .who .note { color:var(--mut); font-size:.88rem; margin-top:2px; }
  .tel { display:inline-block; margin-top:5px; text-decoration:none; background:#e8f5e9; color:var(--ok); border-radius:8px; padding:5px 10px; font-size:.9rem; font-weight:600; }
  .ride.now { background:#e3f2fd; border-radius:8px; }
  .ride.past { opacity:.5; }
  .gap { color:var(--mut); font-size:.82rem; text-align:center; padding:2px 0 6px; font-style:italic; }
  .offb { background:var(--off); border-left:4px solid #ef6c00; border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:.92rem; }
  .sum { color:var(--mut); font-size:.9rem; text-align:right; margin-top:6px; }
  .empty { color:var(--mut); text-align:center; padding:22px 6px; }
  .wk h3 { margin:0 0 4px; font-size:.98rem; display:flex; justify-content:space-between; }
  .wk h3 span { color:var(--mut); font-weight:500; font-size:.85rem; }
  .wk .r { font-size:.93rem; padding:3px 0; }
  .wk .r b { color:var(--c); font-variant-numeric:tabular-nums; }
  .wk.today { outline:2px solid var(--c); }
  .msg { text-align:center; padding:26px 12px; }
  .msg.err { color:var(--err); }
  .foot { text-align:center; margin-top:14px; }
  .foot button { border:0; background:#fff; color:var(--c); border-radius:10px; padding:10px 18px; font-size:.95rem; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .search { position:relative; margin-bottom:10px; }
  .search input { width:100%; padding:12px 40px 12px 14px; font-size:1rem; border:1px solid #cfd6df; border-radius:12px; background:#fff; font-family:inherit; }
  .search button { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; font-size:1.2rem; color:var(--mut); padding:6px; }
  .res { padding:9px 2px; border-top:1px solid var(--line); cursor:pointer; }
  .res:first-child { border-top:0; }
  .res .dt { font-weight:700; }
  .res .dt span { color:var(--mut); font-weight:500; font-size:.85rem; }
  .res .tm2 { color:var(--c); font-weight:700; font-variant-numeric:tabular-nums; }
  .res.past { opacity:.5; }
  .hint { color:var(--mut); font-size:.85rem; margin:8px 2px 4px; }
  .cat { display:inline-block; min-width:24px; padding:0 4px; border:2px solid currentColor; border-radius:5px; font-weight:800; font-size:.75rem; line-height:1.35; text-align:center; color:#1565c0; background:#fff; margin-right:6px; vertical-align:1px; }
  .cat[data-c^="A"] { color:#2e7d32; } .cat[data-c^="C"] { color:#e65100; } .cat[data-c^="D"] { color:#6a1b9a; } .cat[data-c^="T"] { color:#5d4037; } .cat[data-c="BE"] { color:#0d47a1; }
  .warn { background:#fff8e1; color:#8d6e00; border-radius:10px; padding:8px 10px; font-size:.86rem; margin-bottom:10px; text-align:center; }
</style>
</head>

const DNI = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const MIES = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayStr = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return todayStr(d); };
const toMin = t => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60 + m; };
const fmtH = min => (min/60).toLocaleString('pl-PL', { maximumFractionDigits:2 });
const fmtDur = min => { const h = Math.floor(min/60), m = min % 60; return (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : ''); };
const rideWord = n => n === 1 ? 'jazda' : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20) ? 'jazdy' : 'jazd');
const relDay = s => { const t = todayStr(); return s === t ? 'dziś' : s === addDays(t, 1) ? 'jutro' : s === addDays(t, -1) ? 'wczoraj' : DNI[parseD(s).getDay()]; };
const fmtDay = s => { const d = parseD(s); return `${d.getDate()} ${MIES[d.getMonth()]}`; };
const cb = r => r.cat ? `<span class="cat" data-c="${esc(r.cat)}">${esc(r.cat)}</span>` : '';
const telHref = p => { let d = String(p || '').replace(/[^\d+]/g, ''); if (/^\d{9}$/.test(d)) d = '+48' + d; return d; };

/* link: #f=<id pliku>&k=<klucz> – zapamiętywany w telefonie */
let cfg = (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch(e) { return {}; } })();
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get('f') && hp.get('k')) { if (cfg.f !== hp.get('f')) cfg = { f:hp.get('f'), k:hp.get('k') }; else cfg.k = hp.get('k'); store(); }
function store() { try { localStorage.setItem(SKEY, JSON.stringify(cfg)); } catch(e) {} }

let data = cfg.data || null, view = 'today', day = todayStr(), offline = false, loading = false, q = '';
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'l').toLowerCase().trim();

async function load() {
  if (!cfg.f || !cfg.k || loading) return render();
  loading = true;
  try {
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(cfg.f)}?alt=media&key=${encodeURIComponent(cfg.k)}&_=${Date.now()}`, { cache:'no-store' });
    if (r.status === 404 || r.status === 403 || r.status === 401) {
      offline = false; data = null; cfg.data = null; store();
      return render(`Link jest nieaktywny albo został wyłączony.<br>Poproś biuro Auto-MAX o nowy link.`);
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d || d.app !== 'grafik-instruktor') throw new Error('zły plik');
    data = d; cfg.data = d; cfg.got = new Date().toISOString(); store(); offline = false;
  } catch(e) { offline = true; }
  finally { loading = false; }
  render();
}

function ridesOf(date) { return (data && data.days && data.days[date]) || []; }
function offOf(date) { return (data && data.off && data.off[date]) || []; }
function offLine(o) { return `${esc(o.from)}–${esc(o.to)}${o.note ? ' (' + esc(o.note) + ')' : ''}`; }

function dayHtml(date) {
  const rides = ridesOf(date), offs = offOf(date), now = new Date(), nowM = now.getHours()*60 + now.getMinutes(), isToday = date === todayStr();
  let h = offs.length ? `<div class="offb">⛔ <b>Wolne:</b> ${offs.map(offLine).join(', ')}</div>` : '';
  if (!rides.length) return h + `<div class="empty">Brak zaplanowanych jazd.</div>`;
  let min = 0;
  rides.forEach((r, i) => {
    const a = toMin(r.start), b = toMin(r.end); min += Math.max(0, b - a);
    if (i) { const g = a - toMin(rides[i-1].end); if (g > 0) h += `<div class="gap">– przerwa ${fmtDur(g)} –</div>`; }
    const cls = isToday ? (nowM >= a && nowM < b ? 'now' : nowM >= b ? 'past' : '') : '';
    h += `<div class="ride ${cls}"><div class="tm">${esc(r.start)}–${esc(r.end)}<small>${fmtDur(Math.max(0, b - a))}</small></div>
      <div class="who">${cb(r)}<b>${esc(r.name)}</b>${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
      ${r.tel ? `<a class="tel" href="tel:${esc(telHref(r.tel))}">📞 ${esc(r.tel)}</a>` : ''}</div></div>`;
  });
  return h + `<div class="sum">Razem: <b>${rides.length} ${rideWord(rides.length)}, ${fmtH(min)} h</b></div>`;
}

function searchHtml() {
  const words = norm(q).split(/\s+/).filter(Boolean), t = todayStr(), nowM = new Date().getHours()*60 + new Date().getMinutes();
  const hits = [];
  Object.keys((data && data.days) || {}).sort().forEach(d => ridesOf(d).forEach(r => {
    const n = norm(r.name + ' ' + (r.note || ''));
    if (words.every(w => n.includes(w))) hits.push({ d, r, past: d < t || (d === t && toMin(r.end) <= nowM) });
  }));
  if (!hits.length) return `<div class="card"><div class="empty">Nie znaleziono jazd dla „${esc(q)}”.<br><small>Grafik obejmuje ostatnie 7 dni i 3 miesiące naprzód.</small></div></div>`;
  const next = hits.filter(h => !h.past), past = hits.filter(h => h.past).reverse();
  const row = h => `<div class="res ${h.past ? 'past' : ''}" data-d="${h.d}"><div class="dt">${relDay(h.d).charAt(0).toUpperCase() + relDay(h.d).slice(1)}, ${fmtDay(h.d)} <span>${DNI[parseD(h.d).getDay()]}</span></div>
    <div><span class="tm2">${esc(h.r.start)}–${esc(h.r.end)}</span> ${cb(h.r)}${esc(h.r.name)}${h.r.note ? ` <small style="color:var(--mut)">(${esc(h.r.note)})</small>` : ''}</div></div>`;
  const min = next.reduce((a, h) => a + Math.max(0, toMin(h.r.end) - toMin(h.r.start)), 0);
  return `<div class="hint">Najbliższe jazdy: <b>${next.length}</b>${next.length ? ` (${fmtH(min)} h)` : ''}</div>
    <div class="card">${next.length ? next.map(row).join('') : '<div class="empty">Brak zaplanowanych jazd naprzód.</div>'}</div>
    ${past.length ? `<div class="hint">Ostatnie jazdy (7 dni)</div><div class="card">${past.map(row).join('')}</div>` : ''}`;
}

function render(errMsg) {
  const m = $('main'), fq = document.activeElement && document.activeElement.id === 'q' ? document.activeElement.selectionStart : null;
  setTimeout(() => { if (fq != null && $('q')) { $('q').focus(); try { $('q').setSelectionRange(fq, fq); } catch(e) {} } });
  if (data && data.name) { $('who').textContent = data.name; }
  $('upd').textContent = data && data.savedAt ? 'Grafik z: ' + new Date(data.savedAt).toLocaleString('pl-PL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
  if (errMsg) { m.innerHTML = `<div class="card msg err">${errMsg}</div>`; return; }
  if (!cfg.f || !cfg.k) { m.innerHTML = `<div class="card msg">Otwórz ten program z <b>linku, który dostałeś z biura Auto-MAX</b> (np. na WhatsAppie).</div>`; return; }
  if (!data) { m.innerHTML = offline ? `<div class="card msg err">Brak internetu – nie udało się pobrać grafiku.</div>${footHtml()}` : `<div class="msg">Wczytywanie…</div>`; bindFoot(); return; }
  const t = todayStr();
  let h = offline ? `<div class="warn">📴 Brak internetu – pokazuję ostatnio pobrany grafik.</div>` : '';
  h += `<div class="search"><input id="q" type="text" enterkeyhint="search" placeholder="🔍 Szukaj kursanta (imię lub nazwisko)" value="${esc(q)}" autocomplete="off">${q ? '<button id="qx" aria-label="Wyczyść">✕</button>' : ''}</div>`;
  if (q.trim()) { m.innerHTML = h + searchHtml() + footHtml(); bindSearch(); bindFoot(); return; }
  h += `<div class="seg"><button data-v="today" class="${view==='today'?'on':''}">Dziś</button><button data-v="tom" class="${view==='tom'?'on':''}">Jutro</button><button data-v="week" class="${view==='week'?'on':''}">Tydzień</button></div>`;
  if (view === 'week') {
    for (let i = 0; i < 7; i++) {
      const d = addDays(t, i), rides = ridesOf(d), offs = offOf(d);
      const min = rides.reduce((a, r) => a + Math.max(0, toMin(r.end) - toMin(r.start)), 0);
      h += `<div class="card wk ${i===0?'today':''}" data-d="${d}"><h3>${relDay(d).charAt(0).toUpperCase() + relDay(d).slice(1)}, ${fmtDay(d)}<span>${rides.length ? rides.length + ' ' + rideWord(rides.length) + ' · ' + fmtH(min) + ' h' : 'wolne od jazd'}</span></h3>
        ${offs.length ? `<div class="r">⛔ Wolne: ${offs.map(offLine).join(', ')}</div>` : ''}
        ${rides.map(r => `<div class="r"><b>${esc(r.start)}–${esc(r.end)}</b> ${cb(r)}${esc(r.name)}</div>`).join('')}</div>`;
    }
  } else {
    const label = relDay(day);
    h += `<div class="card"><div class="dbar"><button id="pv">◀</button><div class="d">${label.charAt(0).toUpperCase() + label.slice(1)}<small>${DNI[parseD(day).getDay()]}, ${fmtDay(day)} ${parseD(day).getFullYear()}</small></div><button id="nx">▶</button></div></div>
      <div class="card">${dayHtml(day)}</div>`;
  }
  m.innerHTML = h + footHtml();
  m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { view = b.dataset.v; day = view === 'tom' ? addDays(todayStr(), 1) : todayStr(); render(); });
  m.querySelectorAll('[data-d]').forEach(c => c.onclick = () => { day = c.dataset.d; view = 'day'; render(); window.scrollTo(0, 0); });
  if ($('pv')) { $('pv').onclick = () => { day = addDays(day, -1); view = 'day'; render(); }; $('nx').onclick = () => { day = addDays(day, 1); view = 'day'; render(); }; }
  bindSearch(); bindFoot();
}
function bindSearch() {
  const i = $('q'); if (!i) return;
  i.oninput = () => { q = i.value; render(); };
  if ($('qx')) $('qx').onclick = () => { q = ''; render(); };
  $('main').querySelectorAll('.res[data-d]').forEach(c => c.onclick = () => { day = c.dataset.d; view = 'day'; q = ''; render(); window.scrollTo(0, 0); });
}
function footHtml() { return `<div class="foot"><button id="rf">↻ Odśwież</button></div>`; }
function bindFoot() { if ($('rf')) $('rf').onclick = () => { $('rf').textContent = '↻ Odświeżanie…'; load(); }; }

render(); load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (view !== 'day') day = view === 'tom' ? addDays(todayStr(), 1) : todayStr(); load(); } });
</script>
</body>
</html>
